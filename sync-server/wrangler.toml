name = "nashub-sync"
main = "worker.js"
compatibility_date = "2024-11-06"

# Storage. Create it once with:  npx wrangler kv namespace create SYNC_KV
# then paste the id that command prints here.
[[kv_namespaces]]
binding = "SYNC_KV"
id = "PASTE-YOUR-KV-NAMESPACE-ID-HERE"

# Down alerts check every 5 minutes. Remove this block if you do not want alerts.
[triggers]
crons = ["*/5 * * * *"]

# Down alerts also need three secrets, set with `npx wrangler secret put NAME`:
# VAPID_PUBLIC_KEY, VAPID_PRIVATE_KEY and VAPID_SUBJECT. Never write them in this file.
