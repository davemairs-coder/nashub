server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    add_header X-Content-Type-Options nosniff always;
    add_header Referrer-Policy strict-origin-when-cross-origin always;

    # The page and its service worker must never be cached, or a device keeps an old version.
    location = /index.html { add_header Cache-Control "no-cache, no-store, must-revalidate" always; }
    location = /sw.js      { add_header Cache-Control "no-cache, no-store, must-revalidate" always; }
    location = /manifest.json { add_header Cache-Control "no-cache" always; }

    location /fonts/ { add_header Cache-Control "public, max-age=31536000, immutable" always; }

    # The bridge agent and the help file open as plain text.
    location /agent/ { default_type text/plain; charset utf-8; add_header Cache-Control "public, max-age=300" always; types { } }
    location /help/  { default_type text/plain; charset utf-8; add_header Cache-Control "public, max-age=300" always; types { } }

    location / { try_files $uri $uri/ /index.html; }
}
