<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"/>
<title>NAS Hub</title>
<meta name="theme-color" content="#0E1116"/>
<meta name="apple-mobile-web-app-capable" content="yes"/>
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent"/>
<meta name="apple-mobile-web-app-title" content="NAS Hub"/>
<link rel="manifest" href="manifest.json"/>
<link rel="apple-touch-icon" href="icon192.png"/>
<style>
/* ── Bundled fonts (4.16.0): Syne for titles, Instrument Sans for text, IBM Plex Mono for addresses. Licences: fonts/LICENSES.txt ── */
@font-face{font-family:'Syne';font-style:normal;font-weight:700;font-display:swap;src:url(fonts/syne-latin-700-normal.woff2) format('woff2')}
@font-face{font-family:'Instrument Sans';font-style:normal;font-weight:400;font-display:swap;src:url(fonts/instrument-sans-latin-400-normal.woff2) format('woff2')}
@font-face{font-family:'Instrument Sans';font-style:normal;font-weight:500;font-display:swap;src:url(fonts/instrument-sans-latin-500-normal.woff2) format('woff2')}
@font-face{font-family:'Instrument Sans';font-style:normal;font-weight:600;font-display:swap;src:url(fonts/instrument-sans-latin-600-normal.woff2) format('woff2')}
@font-face{font-family:'Instrument Sans';font-style:normal;font-weight:700;font-display:swap;src:url(fonts/instrument-sans-latin-700-normal.woff2) format('woff2')}
@font-face{font-family:'IBM Plex Mono';font-style:normal;font-weight:400;font-display:swap;src:url(fonts/ibm-plex-mono-latin-400-normal.woff2) format('woff2')}
@font-face{font-family:'IBM Plex Mono';font-style:normal;font-weight:500;font-display:swap;src:url(fonts/ibm-plex-mono-latin-500-normal.woff2) format('woff2')}
/* ── Quiet Shelf tokens (4.16.0, redesign phase 1). Every colour in the app comes from here.
   Light is set on html.light; dark is the default. Old names (--t1 …) point at the new ones. ── */
:root{--ground:#0E1116;--surface:#171B22;--raised:#222833;--line:#2A303A;--ink:#ECEFF3;--muted:#A0A8B4;--faint:#6F7885;
--accent:#3D63DD;--accent-text:#9DB4FF;--accent-soft:#1B2A52;--up:#3DDC84;--up-text:#6EE7A4;--up-bg:#0F2418;--up-line:#1F5A36;
--down:#FF6B5E;--down-text:#FFA198;--down-bg:#2A1716;--down-line:#6B2A25;--warn-bg:#2A2110;--warn-line:#6B5417;--warn-text:#F2CC60;
--star:#F2CC60;--pro:#C9A227;--pro-bg:#241D0B;--pro-line:#8A6D1A;--pro-text:#F2CC60;
--f-title:'Syne','Instrument Sans',system-ui,sans-serif;--f-text:'Instrument Sans',system-ui,-apple-system,'Segoe UI',sans-serif;--f-mono:'IBM Plex Mono',ui-monospace,Menlo,monospace;
--t1:var(--ink);--t2:var(--muted);--t3:var(--muted);--t3b:var(--accent-text);--ok:var(--up-text);--warn:var(--warn-text);--warn2:var(--warn-text);--bad:var(--down);--accent2:var(--accent-text);color-scheme:dark}
:root.light{--ground:#F4F6F8;--surface:#FFFFFF;--raised:#EEF1F4;--line:#E1E5EA;--ink:#111827;--muted:#5B6472;--faint:#8A94A3;
--accent:#2446B5;--accent-text:#2446B5;--accent-soft:#E6ECFA;--up:#1B7F4B;--up-text:#166A3E;--up-bg:#E9F6EE;--up-line:#A7D7B8;
--down:#B42318;--down-text:#8C1D13;--down-bg:#FDF1EF;--down-line:#E9B4AD;--warn-bg:#FFF6E5;--warn-line:#EBCB8B;--warn-text:#6B4A00;
--star:#B8860B;--pro:#8A6D1A;--pro-bg:#FFF8E6;--pro-line:#C9A227;--pro-text:#7A5C00;color-scheme:light}

*,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
html,body{min-height:100%;background:var(--ground);font-family:var(--f-text);color:var(--ink);-webkit-font-smoothing:antialiased}
::-webkit-scrollbar{display:none}
/* Header */
.hdr{position:sticky;top:0;z-index:50;background:var(--surface);border-bottom:0.5px solid var(--line);display:flex;align-items:center;justify-content:space-between;padding:10px 14px;padding-top:max(10px,env(safe-area-inset-top));-webkit-transform:translateZ(0);transform:translateZ(0)}
button{touch-action:manipulation;-webkit-tap-highlight-color:transparent;cursor:pointer}
.brand{font-size:17px;font-weight:700;color:var(--ink);letter-spacing:-0.3px;font-family:var(--f-title)}
.hdr-right{display:flex;gap:8px}
/* 4.16.0: the narrowest phones (320 px) had the header 7 px too wide; the new title face made it 23. Drop the bolt there. */
@media (max-width:340px){.hdr-bolt{display:none}.hdr-right{gap:6px}.hdr{padding-left:12px;padding-right:12px}}
/* update banner (4.9.1): clears the iPhone status bar; 44px pill. Banner height = inset pad + 44 pill + 10 pad + 1 border,
   so the header under it drops its own inset and sticks just below the banner instead of being covered when scrolled */
.upd-bar{position:sticky;top:0;z-index:60;background:var(--up-bg);border-bottom:1px solid var(--up-line);padding:10px 14px;padding-top:max(10px,env(safe-area-inset-top));display:flex;align-items:center;justify-content:space-between;gap:10px;cursor:pointer}
.upd-pill{flex-shrink:0;display:inline-flex;align-items:center;min-height:44px;box-sizing:border-box;background:var(--up-bg);border:1px solid var(--up-line);border-radius:10px;padding:0 16px;color:var(--ok);font-size:12px;font-weight:800;white-space:nowrap}
.upd-bar + .hdr{padding-top:10px;top:calc(max(10px,env(safe-area-inset-top)) + 55px)}
.ibtn{background:var(--surface);border:0.5px solid var(--line);border-radius:10px;width:48px;height:48px;font-size:16px;cursor:pointer;color:var(--ink);display:flex;align-items:center;justify-content:center;flex-shrink:0;font-family:inherit}
/* Layout */
.page{padding:16px 16px max(80px,calc(60px + env(safe-area-inset-bottom)));}
.pg-title{font-size:22px;font-weight:800;color:var(--ink);margin:0 0 16px;font-family:var(--f-title);font-weight:700;letter-spacing:-0.02em}
.sr-only{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.lbl{font-size:11px;color:var(--t3);text-transform:uppercase;letter-spacing:1.4px;margin-bottom:8px;margin-left:2px;font-weight:600}
.hint{text-align:center;font-size:12px;color:var(--t3);margin-top:14px}
/* Favorites */
.fav-wrap{margin-bottom:18px}
.fav-scroll{display:flex;gap:10px;overflow-x:auto;padding-bottom:6px;-webkit-overflow-scrolling:touch}
.fav-tile{flex-shrink:0;background:var(--surface);border:1px solid var(--line);border-radius:16px;padding:12px 10px 10px;display:flex;flex-direction:column;align-items:center;gap:6px;width:86px;position:relative;cursor:pointer;-webkit-tap-highlight-color:transparent}
.fav-icon{width:52px;height:52px;border-radius:13px;display:flex;align-items:center;justify-content:center;font-size:28px}
.fav-name{font-size:11px;font-weight:700;color:var(--accent-text);text-align:center;max-width:74px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.fav-unstar{position:absolute;top:5px;left:6px;background:none;border:none;cursor:pointer;font-size:12px;color:var(--warn-text);padding:2px;line-height:1;-webkit-tap-highlight-color:transparent}
/* Status bar */
.sbar{display:flex;justify-content:space-between;align-items:center;background:var(--surface);border:0.5px solid var(--line);border-radius:9px;padding:6px 11px;margin-bottom:12px;font-size:11px;font-weight:700}
/* Group headers */
.grp-hdr{display:flex;justify-content:space-between;align-items:center;padding:6px 10px 6px 13px;margin-bottom:8px;background:var(--surface);border-top:0.5px solid var(--line);border-right:0.5px solid var(--line);border-bottom:0.5px solid var(--line);border-left:3px solid var(--grp-accent,var(--accent));border-radius:0 9px 9px 0;cursor:pointer;user-select:none;-webkit-tap-highlight-color:transparent}
.grp-dot{width:8px;height:8px;border-radius:50%;display:inline-block;flex-shrink:0}
.grp-title{font-size:11px;font-weight:700;color:var(--accent-text);text-transform:uppercase;letter-spacing:1px;font-family:var(--f-text)}
.grp-chevron{font-size:18px;color:var(--t3);transition:transform .2s;line-height:1}
.grp-chevron.collapsed{transform:rotate(-90deg)}
/* App grid */
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(104px,1fr));gap:10px;margin-bottom:18px}
@media(min-width:700px){.page{max-width:680px;margin:0 auto}.hdr-inner{max-width:680px;margin:0 auto;width:100%}}
.tile{background:var(--surface);border-radius:14px;padding:10px 6px 8px;display:flex;flex-direction:column;align-items:center;gap:5px;position:relative;overflow:hidden;cursor:pointer;user-select:none;-webkit-user-select:none;-webkit-touch-callout:none;-webkit-tap-highlight-color:transparent;transition:transform .12s;min-height:108px}
.tile:active{transform:scale(0.91)}
.tile.dim{opacity:0.45;cursor:default}
/* ── Reorder mode (iPhone-style drag to rearrange) ─────────────────────────── */
body.reordering .tile{animation:tile-wiggle .34s ease-in-out infinite alternate}
body.reordering .tile:nth-child(even){animation-delay:-.17s}
body.reordering .tile:nth-child(3n){animation-delay:-.09s}
body.reordering .tile:active{transform:none}
@keyframes tile-wiggle{from{transform:rotate(-1.1deg)}to{transform:rotate(1.1deg)}}
/* While a tile is actually being dragged the FLIP transform owns `transform`,
   so the wiggle has to stand down or the two fight each other. */
body.dragging .tile{animation:none!important}
body.dragging{cursor:grabbing}
.tile.drag-src{opacity:.2!important;animation:none!important}
.tile.drag-ghost{position:fixed;left:0;top:0;z-index:300;pointer-events:none;margin:0;
  animation:none!important;transition:none!important;will-change:transform;
  box-shadow:0 18px 42px rgba(0,0,0,.62);opacity:.96}
.reorder-bar{position:fixed;left:0;right:0;bottom:0;z-index:210;display:flex;align-items:center;
  justify-content:space-between;gap:12px;padding:12px 16px max(12px,env(safe-area-inset-bottom));
  background:var(--surface);border-top:0.5px solid var(--line);box-shadow:0 -6px 24px rgba(0,0,0,.5)}
.reorder-bar-txt{font-size:12px;color:var(--muted);font-weight:600;line-height:1.4}
.reorder-done{flex-shrink:0;min-height:44px;padding:0 22px;background:var(--accent);
  border:none;border-radius:12px;color:#fff;font-size:15px;font-weight:800;font-family:inherit;cursor:pointer}
/* ── Full-screen log / error viewer ────────────────────────────────────────── */
.log-overlay{position:fixed;inset:0;z-index:300;background:var(--ground);display:flex;flex-direction:column}
.log-hdr{flex-shrink:0;display:flex;align-items:center;gap:10px;padding:8px 10px;
  padding-top:max(8px,env(safe-area-inset-top));background:var(--surface);border-bottom:0.5px solid var(--line)}
.log-btn{flex-shrink:0;min-width:44px;min-height:44px;padding:0 14px;background:var(--surface);
  border:0.5px solid var(--line);border-radius:11px;color:var(--ink);font-size:14px;font-weight:700;
  font-family:inherit;cursor:pointer;display:flex;align-items:center;justify-content:center;gap:4px}
.log-btn:active{background:var(--raised)}
.log-btn-alt{color:var(--accent-text)}
.log-title{flex:1;min-width:0;text-align:center;font-size:12px;font-weight:700;color:var(--muted);
  font-family:'IBM Plex Mono',ui-monospace,monospace;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.log-body{flex:1;min-height:0;overflow:auto;-webkit-overflow-scrolling:touch;
  padding:12px 12px max(24px,env(safe-area-inset-bottom))}
.log-pre{white-space:pre-wrap;word-break:break-word;font:12px/1.55 'IBM Plex Mono',ui-monospace,monospace;
  color:var(--ink);-webkit-user-select:text;user-select:text;-webkit-touch-callout:default}
.log-trunc{background:var(--warn-bg);border:1px solid var(--warn-line);border-radius:10px;padding:9px 12px;
  margin-bottom:10px;font-size:11px;color:var(--warn-text);line-height:1.5}
body.light .log-overlay{background:var(--surface)}
body.light .log-hdr{background:var(--surface);border-bottom-color:var(--line)}
body.light .log-pre{color:var(--ink)}
body.light .log-btn{background:var(--surface);border-color:var(--line);color:var(--ink)}
body.light .log-btn:active{background:var(--raised)}
body.light .log-btn-alt{color:var(--accent-text)}
body.light .log-title{color:var(--muted)}
body.light .log-trunc{background:var(--warn-bg);border-color:var(--warn-line);color:var(--warn-text)}
body.light .reorder-bar{background:var(--surface);border-top-color:var(--line)}
body.light .reorder-bar-txt{color:var(--muted)}
.tile-icon{width:42px;height:42px;border-radius:11px;display:flex;align-items:center;justify-content:center;font-size:22px;margin-top:3px}
.tile-name{font-size:11px;font-weight:700;color:var(--accent-text);text-align:center;line-height:1.3}
.tile-sub{font-size:11px;color:var(--t3)}
.tile-note{font-size:11px;color:var(--t3);text-align:center;max-width:90%;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.star-btn{position:absolute;top:2px;left:3px;background:none;border:none;cursor:pointer;font-size:15px;color:var(--muted);line-height:1;padding:6px;min-width:28px;min-height:28px;-webkit-tap-highlight-color:transparent}
.star-btn.on{color:var(--warn-text)}
.sdot{position:absolute;top:8px;right:8px;width:8px;height:8px;border-radius:50%}
.online{background:#00e87a}
.offline{background:#ff5050}
.slow{background:#FFC300}
.checking{border:2px solid var(--line);border-top-color:var(--accent);animation:spin .9s linear infinite;background:transparent!important}
@keyframes spin{to{transform:rotate(360deg)}}
/* ── Health Sparkline (tile) ─────────────────────── */
.spark{display:flex;align-items:flex-end;gap:1.5px;height:14px;margin-top:2px}
.spark-bar{width:5px;border-radius:2px 2px 0 0;flex-shrink:0;transition:height .5s ease}
/* ── Health Dashboard (Quick Actions) ───────────── */
.h-stats{display:flex;gap:6px;margin-bottom:10px}
.h-stat{flex:1;background:var(--surface);border:1px solid var(--line);border-radius:10px;padding:10px 4px;text-align:center}
.h-stat-val{font-size:17px;font-weight:800;line-height:1;letter-spacing:-.5px}
.h-stat-lbl{font-size:11px;color:var(--t3);text-transform:uppercase;letter-spacing:.9px;font-weight:700;margin-top:4px}
.h-bars{display:flex;align-items:flex-end;gap:1px;height:36px;overflow:hidden;border-radius:4px}
.h-bar{flex:1;border-radius:2px 2px 0 0;min-height:2px;transition:height .5s ease}
.h-legend{display:flex;justify-content:space-between;font-size:11px;color:var(--t3);margin-top:3px}
/* Quick actions modal */
.modal-overlay{position:fixed;inset:0;background:rgba(0,0,0,.78);z-index:200;display:flex;align-items:flex-end;justify-content:center}
.modal-box{background:var(--surface);border:0.5px solid var(--line);border-radius:22px 22px 0 0;padding:22px 20px 40px;width:100%;max-width:520px;max-height:88vh;overflow-y:auto}
/* 24h uptime bars */
.up-bars{display:flex;align-items:flex-end;gap:2px;height:28px;margin-top:8px}
.up-bar{flex:1;border-radius:2px 2px 0 0;min-height:3px;transition:height .4s ease}
/* ── Kid / guest mode ────────────────────────────────────────────────────── */
.kid-wrap{min-height:100vh}
.kid-bar{position:sticky;top:0;z-index:50;background:var(--surface);border-bottom:0.5px solid var(--line);display:flex;align-items:center;justify-content:space-between;padding:10px 14px;padding-top:max(10px,env(safe-area-inset-top))}
/* ── Starter tile packs ──────────────────────────────────────────────────── */
.pack-card{background:var(--surface);border:1px solid var(--line);border-radius:16px;padding:15px;margin-bottom:11px}
.pack-top{display:flex;gap:12px;align-items:flex-start}
.pack-emoji{width:46px;height:46px;border-radius:13px;display:flex;align-items:center;justify-content:center;font-size:25px;flex-shrink:0}
.pack-name{font-size:16px;font-weight:800;color:var(--t1);letter-spacing:-.2px}
.pack-blurb{font-size:12.5px;color:var(--t2);line-height:1.55;margin-top:3px}
.pack-apps{display:flex;flex-wrap:wrap;gap:6px;margin-top:12px}
.pack-chip{font-size:11.5px;background:var(--surface);border:1px solid var(--line);border-radius:999px;padding:4px 10px;color:var(--t2);white-space:nowrap}
.pack-chip.have{opacity:.5;border-style:dashed}
.pack-port{font-family:'IBM Plex Mono',ui-monospace,monospace;font-size:10.5px;color:var(--t3);margin-left:3px}
.pack-btn{width:100%;margin-top:13px;padding:12px;background:transparent;border:1px solid;border-radius:12px;font-size:14px;font-weight:700;cursor:pointer;font-family:inherit}
.pack-btn:disabled{opacity:.45;cursor:default;border-color:var(--line)!important;color:var(--t3)!important}
.pack-edit{border-top:1px solid var(--line);margin-top:13px;padding-top:11px}
body.light .pack-card{background:var(--surface);border-color:var(--line)}
body.light .pack-chip{background:var(--surface);border-color:var(--line)}
/* ── Addresses (bulk host change) ────────────────────────────────────────── */
.host-card{background:var(--surface);border:0.5px solid var(--line);border-radius:14px;padding:14px;margin-bottom:10px}
.host-top{display:flex;align-items:flex-start;justify-content:space-between;gap:10px}
.host-name{font:700 15px 'IBM Plex Mono',ui-monospace,monospace;color:var(--t1);word-break:break-all}
.host-meta{font-size:11.5px;font-weight:700;margin-top:3px}
.host-btn{background:var(--raised);border:1px solid var(--line);border-radius:9px;padding:8px 14px;color:var(--accent-text);font-size:12.5px;font-weight:700;cursor:pointer;flex-shrink:0;font-family:inherit}
.host-apps{display:flex;flex-wrap:wrap;gap:6px;margin-top:11px}
.host-chip{font-size:11.5px;background:var(--surface);border:1px solid var(--line);border-radius:999px;padding:4px 10px;color:var(--t2);max-width:100%;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.host-warn{font-size:11.5px;color:var(--warn-text);background:var(--warn-bg);border:1px solid var(--warn-line);border-radius:9px;padding:8px 10px;margin-top:10px;line-height:1.55}
.host-edit{border-top:1px solid var(--line);margin-top:12px;padding-top:10px}
/* Note and panel styles (from 4.15.0). Sizes are stated here on purpose: every control 52px tall, text 14px or more. */
.ul-btn{display:flex;align-items:center;justify-content:center;box-sizing:border-box;width:100%;min-height:52px;padding:14px 16px;margin-top:12px;border:none;border-radius:13px;font-family:inherit;font-size:16px;font-weight:800;line-height:1.3;text-align:center;text-decoration:none;cursor:pointer}
.ul-pri{background:linear-gradient(135deg,#6d28d9,#9333ea);color:#fff}
.ul-sec{background:transparent;border:1px solid var(--pro-line);color:var(--ink)}
.ul-txt{font-size:14px;line-height:1.6;color:var(--t2);margin:8px 0 0}
.ul-panel{background:var(--surface);border:1px solid rgba(124,58,237,.45);border-radius:16px;padding:16px;margin-bottom:16px}
.ul-head{font-size:16px;font-weight:800;color:var(--t1);line-height:1.5}
.ul-code{font-family:'IBM Plex Mono',ui-monospace,monospace;font-size:20px;font-weight:700;letter-spacing:2px;color:var(--ink)}
.ul-spin{display:inline-block;width:16px;height:16px;border:2px solid var(--pro-line);border-top-color:transparent;border-radius:50%;animation:spin 1s linear infinite;vertical-align:-3px;margin-right:8px}
.ul-note{font-size:14px;line-height:1.6;color:var(--t1);background:rgba(124,58,237,.12);border:1px solid rgba(124,58,237,.4);border-radius:12px;padding:12px 14px;margin-bottom:12px}
body.light .ul-sec{border-color:var(--pro-line);color:var(--pro-text)}
body.light .ul-panel{background:var(--surface);border-color:var(--pro-line)}
body.light .ul-code{color:var(--pro-text)}
body.light .ul-note{background:var(--surface);border-color:var(--pro-line)}
.host-prev{font:12px 'IBM Plex Mono',ui-monospace,monospace;color:var(--t3);margin-top:2px;word-break:break-all}
body.light .host-card{background:var(--surface);border-color:var(--line)}
body.light .host-btn{background:var(--raised);border-color:var(--line);color:var(--accent-text)}
body.light .host-chip{background:var(--surface);border-color:var(--line)}
/* ── Command palette ─────────────────────────────────────────────────────── */
.pal-overlay{position:fixed;inset:0;background:rgba(0,0,0,.78);z-index:220;display:flex;align-items:flex-start;justify-content:center;padding:max(12px,env(safe-area-inset-top)) 12px 12px}
.pal-box{background:var(--surface);border:0.5px solid var(--line);border-radius:18px;width:100%;max-width:560px;margin-top:6vh;overflow:hidden;box-shadow:0 24px 60px rgba(0,0,0,.55);display:flex;flex-direction:column;max-height:82vh}
.pal-inp{width:100%;background:transparent;border:none;border-bottom:1px solid var(--line);padding:17px 18px;color:var(--ink);font-size:17px;outline:none;font-family:inherit}
.pal-inp::placeholder{color:var(--t3)}
.pal-list{overflow-y:auto;padding:6px;flex:1;-webkit-overflow-scrolling:touch}
.pal-sec{font:700 10px var(--f-text);color:var(--t3);letter-spacing:1px;padding:10px 12px 5px;text-transform:uppercase}
.pal-row{display:flex;align-items:center;gap:11px;padding:11px 12px;border-radius:11px;cursor:pointer;border:1px solid transparent;-webkit-tap-highlight-color:transparent}
.pal-row[aria-selected="true"]{background:var(--raised);border-color:var(--accent)}
.pal-ico{width:26px;text-align:center;font-size:17px;flex-shrink:0}
.pal-name{font-size:14px;font-weight:700;color:var(--t1);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.pal-sub{font-size:11px;color:var(--t3);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;margin-top:2px}
.pal-dot{width:7px;height:7px;border-radius:50%;flex-shrink:0}
.pal-kbd{font:600 10px 'IBM Plex Mono',ui-monospace,monospace;color:var(--t3);border:1px solid var(--line);border-radius:5px;padding:2px 6px;flex-shrink:0}
.pal-foot{border-top:1px solid var(--line);padding:9px 14px;display:flex;gap:14px;font-size:10.5px;color:var(--t3);flex-wrap:wrap}
.pal-empty{padding:26px 16px;text-align:center;font-size:13px;color:var(--t3);line-height:1.6}
body.light .pal-overlay{background:rgba(180,180,210,.7)}
body.light .pal-box{background:var(--surface);border-color:var(--line)}
body.light .pal-inp{color:var(--ink);border-bottom-color:var(--line)}
body.light .pal-row[aria-selected="true"]{background:var(--accent-soft);border-color:var(--accent)}
.qa-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin-bottom:4px}
.qa-btn{background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:12px 8px;color:var(--t1);display:flex;flex-direction:column;align-items:center;gap:6px;cursor:pointer;font-family:inherit;-webkit-tap-highlight-color:transparent}
.qa-btn:active{transform:scale(0.94)}
.qa-icon{font-size:22px}
.qa-label{font-size:11px;font-weight:700;color:var(--accent-text);text-align:center;line-height:1.3}
.util-row{display:flex;gap:8px;margin-top:14px}
.util-btn{flex:1;padding:10px 6px;background:transparent;border:1px solid var(--line);border-radius:9px;color:var(--t2);font-size:12px;font-weight:700;cursor:pointer;font-family:inherit}
/* Groups manage */
.grp-card{background:var(--surface);border:0.5px solid var(--line);border-radius:14px;padding:14px;margin-bottom:10px}
.grp-picker{display:flex;flex-wrap:wrap;gap:8px;margin-top:6px}
.grp-pick-btn{padding:7px 14px;background:var(--surface);border:1px solid var(--line);border-radius:10px;color:var(--t2);font-weight:600;cursor:pointer;font-size:13px;font-family:inherit}
.grp-pick-btn.on{border-color:var(--accent);background:rgba(82,82,255,.1);color:var(--ink)}
.emoji-row{display:flex;flex-wrap:wrap;gap:6px;margin-top:6px}
.ep{font-size:20px;cursor:pointer;padding:4px;border-radius:6px;border:2px solid transparent}
.ep.on{border-color:var(--accent);background:rgba(82,82,255,.12)}
.color-row{display:flex;flex-wrap:wrap;gap:8px;margin-top:6px}
.csw{width:28px;height:28px;border-radius:7px;cursor:pointer;border:3px solid transparent}
.csw.on{border-color:white;box-shadow:0 0 0 2px var(--accent)}
/* Manage */
.mrow{background:var(--surface);border:0.5px solid var(--line);border-radius:14px;padding:12px;display:flex;align-items:center;gap:12px;cursor:pointer;-webkit-tap-highlight-color:transparent;margin-bottom:8px;min-width:0}
.micon{width:46px;height:46px;border-radius:10px;display:flex;align-items:center;justify-content:center;flex-shrink:0;font-size:24px}
.mname{font-weight:700;font-size:15px;color:var(--ink)}
.maddr{font-size:12px;color:var(--t3);margin-top:2px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;font-family:var(--f-mono)}
.chev{color:var(--t3);font-size:22px;line-height:1;flex-shrink:0}
.arr{background:var(--surface);border:1px solid var(--line);border-radius:5px;width:28px;height:28px;color:var(--t2);font-size:11px;cursor:pointer;display:flex;align-items:center;justify-content:center;font-family:inherit}
/* Catalog */
.sbar-input{width:100%;background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:12px 16px;color:var(--ink);font-size:15px;outline:none;margin-bottom:14px;font-family:inherit}
.cat-pills{display:flex;gap:8px;overflow-x:auto;padding-bottom:10px;margin-bottom:14px}
.cpill{background:var(--surface);border:1px solid var(--line);border-radius:20px;padding:6px 14px;color:var(--t2);font-size:12px;font-weight:600;cursor:pointer;white-space:nowrap;flex-shrink:0}
.cpill.on{background:var(--accent-soft);border-color:var(--accent);color:var(--ink)}
.cat-grid{display:grid;grid-template-columns:repeat(2,1fr);gap:12px}
.ccard{background:var(--surface);border:0.5px solid var(--line);border-radius:14px;padding:14px 12px;display:flex;flex-direction:column;gap:6px;position:relative;cursor:pointer;-webkit-tap-highlight-color:transparent}
.ccard-icon{width:52px;height:52px;border-radius:12px;display:flex;align-items:center;justify-content:center;font-size:28px}
.ccard-name{font-weight:700;font-size:14px;color:var(--ink)}
.ccard-desc{font-size:12px;color:var(--t2);line-height:1.4}
.ctag{align-self:flex-start;border-radius:20px;padding:2px 10px;font-size:11px;font-weight:700;background:var(--raised)!important;color:var(--t2)!important}
.cbadge{position:absolute;top:10px;right:10px;font-size:11px;font-weight:700}
/* Edit */
.edit-top{display:flex;align-items:center;gap:14px;margin-bottom:22px}
.edit-icon{width:64px;height:64px;border-radius:16px;display:flex;align-items:center;justify-content:center;flex-shrink:0;font-size:36px}
.flbl{font-size:12px;color:var(--t2);text-transform:uppercase;letter-spacing:.9px;margin-bottom:6px;font-weight:600;display:block}
.fhint{font-size:11px;color:var(--t3);text-transform:none;letter-spacing:0;font-weight:400}
.inp{width:100%;background:var(--surface);border:1px solid var(--line);border-radius:10px;padding:13px 14px;color:var(--ink);font-size:15px;outline:none;margin-bottom:6px;font-family:inherit}
textarea.inp{resize:vertical;min-height:72px;line-height:1.5}
.tog-row{display:flex;gap:8px;margin-bottom:6px}
.mg-sec{margin-bottom:10px;border:1px solid var(--line);border-radius:14px;background:var(--surface);overflow:hidden}
.mg-hd{width:100%;display:flex;align-items:center;gap:10px;padding:13px 14px;background:transparent;border:0;color:var(--t1);font:inherit;font-weight:800;font-size:15px;cursor:pointer;text-align:left}
.mg-hd .mg-sum{margin-left:auto;font-weight:600;font-size:12px;color:var(--t3);text-align:right;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;max-width:48%}
.mg-hd .mg-chev{color:var(--t3);font-size:13px;transition:transform .15s;flex:none}
.mg-sec.open .mg-hd .mg-chev{transform:rotate(90deg)}
.mg-body{padding:0 10px 10px}
.mg-body .btn-cat{margin-bottom:8px}
body.light .mg-sec{background:var(--surface);border-color:var(--line)}
.tog{flex:1;padding:11px;background:var(--surface);border:1px solid var(--line);border-radius:10px;color:var(--t2);font-weight:700;cursor:pointer;font-size:14px;font-family:inherit}
/* Selected state must be unmistakable: Dave read the old pair as highlighting the
   wrong pill. The logic was right; the 2-shade difference was too quiet to read as
   "this one is on". Accent fill + ring + a ✓ glyph (see .tog.on::before). */
.tog.on{background:var(--accent);border-color:var(--accent);color:#fff;box-shadow:0 0 0 2px rgba(75,110,247,.28)}
.tog.on::before{content:"✓ ";font-weight:800}
.tog:disabled{opacity:.45;cursor:not-allowed}
/* version beside the product name in the header (DDS standing rule) */
.brand-ver{font:500 12px 'IBM Plex Mono',ui-monospace,monospace;color:var(--t2);letter-spacing:.3px}
.prev-box{background:var(--surface);border:0.5px solid var(--line);border-radius:10px;padding:10px 14px;margin-bottom:10px}
.prev-lbl{font-size:11px;color:var(--t3);display:block;margin-bottom:3px}
.prev-url{font-size:13px;color:var(--accent-text);font-family:var(--f-mono);word-break:break-all}
.btn-save{padding:14px;background:var(--accent);border:none;border-radius:13px;color:white;font-size:16px;font-weight:800;cursor:pointer;width:100%;margin-top:12px;font-family:inherit}
.btn-fav{padding:11px;background:transparent;border:1px solid var(--line);border-radius:13px;color:var(--t2);font-size:14px;font-weight:700;cursor:pointer;width:100%;margin-top:8px;font-family:inherit}
.btn-fav.on{border-color:var(--warn-line);color:var(--warn-text)}
.btn-del{padding:12px;background:transparent;border:1px solid var(--down);border-radius:13px;color:var(--down-text);font-size:14px;font-weight:600;cursor:pointer;width:100%;margin-top:8px;font-family:inherit}
.btn-can{padding:12px;background:transparent;border:1px solid var(--line);border-radius:13px;color:var(--t2);font-size:14px;cursor:pointer;width:100%;margin-top:8px;font-family:inherit}
.btn-cat{width:100%;background:linear-gradient(135deg,var(--raised),var(--accent-soft));border:1px solid var(--line);border-radius:14px;padding:14px 18px;color:var(--accent-text);font-size:15px;font-weight:700;cursor:pointer;margin-bottom:12px;text-align:left;display:block;font-family:inherit}
.note-preview{font-size:11px;color:var(--t2);background:var(--surface);border-left:3px solid;border-radius:0 6px 6px 0;padding:6px 10px;margin-top:4px;line-height:1.5}
/* Tailscale */
.jf-badge{position:absolute;top:6px;right:22px;background:linear-gradient(135deg,var(--pro-bg),#6d28d9);border:0.5px solid var(--pro-line);border-radius:5px;padding:2px 6px;font-size:11px;font-weight:800;color:#fff;letter-spacing:.4px;line-height:1.5;z-index:2;cursor:pointer;font-family:'IBM Plex Mono',ui-monospace,monospace;white-space:nowrap}
.jf-badge.live{background:linear-gradient(135deg,var(--up-bg),#15803d);border-color:var(--up);box-shadow:0 0 8px rgba(34,197,94,.45)}
.jf-badge.setup{background:var(--raised);border-color:var(--line);color:var(--accent-text)}
.ts-badge{position:absolute;bottom:6px;right:6px;background:var(--accent);border-radius:4px;padding:1px 5px;font-size:11px;font-weight:800;color:white;letter-spacing:.5px;line-height:1.6}
.ts-pill{display:inline-flex;align-items:center;gap:4px;background:rgba(45,110,247,.15);border:1px solid rgba(45,110,247,.35);border-radius:20px;padding:3px 8px;font-size:11px;font-weight:700;color:var(--accent-text)}
.ts-guide-step{display:flex;align-items:flex-start;gap:12px;padding:12px 14px;background:var(--surface);border:1px solid var(--line);border-radius:12px;margin-bottom:8px}
.ts-num{width:26px;height:26px;border-radius:50%;background:var(--accent);display:flex;align-items:center;justify-content:center;font-size:12px;font-weight:800;color:white;flex-shrink:0}
/* Share/Import */
.ta{width:100%;background:var(--surface);border:1px solid var(--line);border-radius:10px;padding:12px 14px;color:var(--ink);font-size:14px;outline:none;resize:vertical;font-family:var(--f-mono);margin-bottom:12px;line-height:1.5}
.qr-box{display:flex;flex-direction:column;align-items:center;background:white;border-radius:16px;padding:16px;margin-bottom:16px;gap:10px}
.code-box{background:var(--surface);border:0.5px solid var(--line);border-radius:10px;padding:12px 14px;margin-bottom:14px;font-family:var(--f-mono);font-size:11px;color:var(--accent-text);word-break:break-all;line-height:1.6}
.imp-card{background:var(--surface);border:0.5px solid var(--line);border-radius:12px;padding:14px;margin-bottom:12px}
/* Onboarding */
.ob-overlay{position:fixed;inset:0;background:rgba(0,0,0,.92);z-index:300;display:flex;align-items:flex-end;justify-content:center}
.ob-sheet{background:var(--surface);border-radius:22px 22px 0 0;width:100%;max-width:520px;max-height:92vh;overflow-y:auto;padding:20px 20px 44px;position:relative;border:0.5px solid var(--line);border-bottom:none}
.ob-prog-track{height:4px;background:var(--surface);border-radius:4px;margin-bottom:16px;overflow:hidden}
.ob-prog-fill{height:100%;background:var(--accent);border-radius:4px;transition:width .4s ease}
.ob-skip{position:absolute;top:8px;right:8px;min-height:48px;min-width:48px;padding:12px 18px;background:rgba(255,255,255,.06);border:1px solid var(--t3);border-radius:10px;color:var(--t1);font-size:16px;font-weight:600;cursor:pointer;font-family:inherit}
.ob-emoji{font-size:48px;text-align:center;margin-bottom:12px}
.ob-title{font-size:22px;font-weight:800;color:var(--ink);text-align:center;margin-bottom:8px;letter-spacing:-.3px}
.ob-sub{font-size:14px;color:var(--t2);text-align:center;line-height:1.7;margin-bottom:4px}
.ob-feature{display:flex;align-items:flex-start;gap:12px;padding:10px 14px;background:var(--surface);border-radius:10px;border:1px solid var(--line);margin-bottom:8px}
.ob-option{display:flex;align-items:center;gap:12px;padding:14px;border-radius:14px;border:0.5px solid var(--line);cursor:pointer;margin-bottom:8px;-webkit-tap-highlight-color:transparent;background:var(--surface);transition:all .15s}
.ob-option.sel{border-color:var(--accent);background:rgba(82,82,255,.1)}
.ob-app-pick{display:flex;align-items:center;gap:8px;padding:10px;border-radius:12px;border:0.5px solid var(--line);cursor:pointer;-webkit-tap-highlight-color:transparent;background:var(--surface);transition:all .15s}
.ob-app-pick.sel{border-color:var(--ac)}
.ob-primary{padding:14px;background:var(--accent);border:none;border-radius:13px;color:white;font-size:15px;font-weight:800;cursor:pointer;width:100%;margin-top:12px;font-family:inherit}
.ob-secondary{padding:11px;background:transparent;border:1px solid var(--line);border-radius:13px;color:var(--t2);font-size:13px;cursor:pointer;width:100%;margin-top:8px;font-family:inherit}
/* Home/Away, NAS-off banner, live tiles, import list */
.seg{display:grid;grid-template-columns:1fr 1fr 1fr;background:var(--surface);border:.5px solid var(--line);border-radius:12px;padding:3px;gap:3px;margin-bottom:10px}
.seg span{text-align:center;padding:8px 4px;border-radius:9px;font-size:13px;font-weight:600;color:var(--t2);cursor:pointer;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.seg .on{background:var(--accent);color:#fff}
.banner-fold{margin:0 0 12px}
.banner-fold>summary{list-style:none;display:flex;align-items:center;justify-content:space-between;gap:12px;min-height:48px;padding:12px 14px;border-radius:14px;background:var(--warn-bg);border:1px solid var(--warn-line);color:var(--warn);font-size:15px;font-weight:700;cursor:pointer}
.banner-fold>summary::-webkit-details-marker{display:none}
.banner-fold .bf-more{font-size:20px;line-height:1;transition:transform .15s}
.banner-fold[open] .bf-more{transform:rotate(90deg)}
.banner-fold[open]>summary{margin-bottom:12px}
body.light .banner-fold>summary{background:var(--warn-bg);border-color:var(--warn-line)}
.banner{margin:0 0 12px;border-radius:14px;padding:14px;background:var(--warn-bg);border:1px solid var(--warn-line)}
.banner h4{margin:0 0 4px;font-size:14px;font-weight:700;line-height:1.3;color:var(--warn)}
.banner p{font-size:12px;color:var(--warn2);line-height:1.55;margin:0}
.banner .acts{display:flex;gap:8px;margin-top:10px}
.banner .acts span{flex:1;text-align:center;padding:9px 6px;border-radius:9px;font-size:12px;font-weight:700;background:var(--warn-bg);border:1px solid var(--warn-line);color:var(--warn);cursor:pointer}
/* Red banner: reserved for hardware that is failing, not an app that won't open. */
.banner.bad{background:linear-gradient(135deg,var(--surface),var(--down-bg));border-color:var(--down-line)}
.banner.bad h4{color:var(--down-text)}
.banner.bad p{color:var(--down-text)}
.banner.bad .acts span{background:var(--down-bg);border-color:var(--down-line);color:var(--down-text)}
.tile-live{font:600 11px/1.3 'IBM Plex Mono',ui-monospace,monospace;color:var(--t2);text-align:center;max-width:96%;overflow:hidden;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;word-break:break-word}
.list{margin-top:12px;background:var(--surface);border:.5px solid var(--line);border-radius:14px;overflow:hidden;margin-bottom:12px}
.item{display:flex;align-items:center;gap:10px;padding:10px 12px;border-bottom:1px solid var(--line)}
.item:last-child{border-bottom:0}
.item .ic{width:34px;height:34px;border-radius:9px;display:flex;align-items:center;justify-content:center;font-size:18px;background:color-mix(in srgb,var(--c,var(--accent)) 16%,transparent);flex-shrink:0}
.item .nm{font-size:13px;font-weight:700;color:var(--ink);line-height:1.25}
.item .im{font:11px 'IBM Plex Mono',ui-monospace,monospace;color:var(--t3);overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.item .pt{margin-left:auto;font:600 12px 'IBM Plex Mono',ui-monospace,monospace;color:var(--accent-text);flex-shrink:0}
.sw{width:38px;height:24px;border-radius:12px;background:var(--accent);position:relative;flex-shrink:0;cursor:pointer}
.sw::after{content:"";position:absolute;right:3px;top:3px;width:18px;height:18px;border-radius:50%;background:var(--surface)}
.sw.off{background:var(--raised)}.sw.off::after{right:auto;left:3px;background:#6d7599}
body.light .seg{background:var(--raised);border-color:var(--line)}
body.light .banner{background:var(--warn-bg);border-color:var(--warn-line)}
body.light .banner.bad{background:var(--down-bg);border-color:var(--down-line)}
body.light .banner.bad h4{color:var(--down-text)}
body.light .banner.bad p{color:var(--down-text)}
body.light .banner.bad .acts span{background:var(--surface);border-color:var(--down);color:var(--down-text)}
body.light .banner .acts span{background:var(--surface);border-color:var(--warn-line)}
body.light .list,body.light .item{background:var(--surface);border-color:var(--line)}
body.light .item .nm{color:var(--t1)}
/* Toast */
.toast{position:fixed;top:64px;left:50%;transform:translateX(-50%);background:var(--surface);padding:10px 22px;border-radius:24px;font-size:14px;font-weight:700;z-index:400;max-width:min(92vw,520px);text-align:center;line-height:1.4;border:1px solid;box-shadow:0 4px 24px rgba(0,0,0,.5);pointer-events:none}
/* Empty */
.empty{display:flex;flex-direction:column;align-items:center;padding:60px 20px;text-align:center}
.empty-icon{font-size:52px;margin-bottom:14px}
.empty-title{font-size:20px;font-weight:800;color:var(--ink);margin-bottom:8px}
.empty-sub{font-size:16px;color:var(--t2);line-height:1.7}
@keyframes fadeUp{from{opacity:0;transform:translateY(10px)}to{opacity:1;transform:translateY(0)}}
.fade-in{animation:fadeUp .3s ease both}
/* Scanner */
.scan-card{background:var(--surface);border:0.5px solid var(--line);border-radius:14px;padding:16px;margin-bottom:12px}
.scan-prog-track{height:8px;background:var(--surface);border-radius:8px;overflow:hidden;margin:10px 0}
.scan-prog-fill{height:100%;background:linear-gradient(90deg,var(--accent),var(--accent),var(--accent));border-radius:8px;transition:width .4s ease}
.scan-result{display:flex;align-items:center;gap:10px;padding:8px 0;border-bottom:1px solid var(--line)}
.scan-result:last-child{border-bottom:none}
.scan-icon{width:40px;height:40px;border-radius:10px;display:flex;align-items:center;justify-content:center;font-size:22px;flex-shrink:0}
.scan-add-btn{padding:6px 14px;background:transparent;border:1px solid var(--up-line);border-radius:8px;color:var(--up-text);font-size:12px;font-weight:700;cursor:pointer;font-family:inherit;flex-shrink:0}
.scan-add-btn.added{border-color:var(--line);color:var(--ink);cursor:default}
.scan-warning{background:rgba(80,60,0,.2);border:1px solid var(--warn-line);border-radius:12px;padding:12px 14px;font-size:13px;color:var(--warn-text);line-height:1.7;margin-bottom:14px}
.proto-row{display:flex;gap:8px;margin-bottom:10px}
/* ── Light Mode ─────────────────────────────────────────────────────────── */
body.light{background:var(--ground);color:var(--ink)}
body.light .hdr{background:var(--raised);border-color:var(--line)}
body.light .brand{color:var(--accent-text)}
body.light .ibtn{background:var(--raised);border-color:var(--line);color:var(--ink)}
body.light .ibtn.theme-on{background:var(--surface);border-color:var(--warn-line);color:var(--warn-text)}
body.light .page{background:transparent}
body.light .pg-title{color:var(--accent-text)}
body.light .lbl{color:var(--t3)}
body.light .sbar{background:var(--raised);border-color:var(--line);color:var(--ink)}
body.light .grp-hdr{background:var(--raised);border-color:var(--line)}
body.light .grp-title{color:var(--accent-text)}
body.light .grp-chevron{color:var(--t3)}
body.light .tile{background:var(--surface)}
body.light .tile-name{color:var(--ink)}
body.light .tile-sub,body.light .tile-note{color:var(--t3)}
body.light .star-btn{color:var(--muted)}
body.light .star-btn.on{color:var(--warn-text)}
body.light .fav-tile{background:var(--surface);border-color:var(--line)}
body.light .fav-name{color:var(--ink)}
body.light .fav-icon{background:var(--raised)}

/* iOS zooms the whole page into any editable text box under 16px and leaves it zoomed,
   which cut off the right edge of Edit on Dave's iPhone (2026-09-12). Touch screens only,
   so desktop keeps its tighter look; read-only code boxes are never focused for typing. */
@media (hover:none) and (pointer:coarse){
  .inp:not([readonly]),.sbar-input,.ta:not([readonly]),#restore-txt,input[type=text],input[type=password],input[type=search],input[type=url],input[type=number],input:not([type]),select{font-size:16px!important}
}

// A Tailscale hostname is a HOST, not a URL. People paste "http://100.x.x.x/" from a
// browser bar, and every consumer here re-prepends the protocol and appends ":PORT" —
// which produced "http://http://100.64.0.5/:PORT" both in the saved-confirmation
// preview AND in buildUrl(), i.e. every Away-mode link was broken, not just the text.
// Normalize once on the way in, and again on the way out for values already stored.
function normalizeHost(v){
  return String(v||"").trim()
    .replace(/^[a-z][a-z0-9+.-]*:\/\//i,"")  // strip any scheme
    .replace(/\/.*$/,"")                      // strip path and trailing slash
    .replace(/:\d+$/,"")                      // strip a port; the port comes per-app
    .trim();
}
function saveTsHost(val,proto){
  // Inputs write to S.tsDraft/S.tsProtoDraft, never to the live values: the live
  // ones drive buildUrl() and ride along in every sync publish, so a half-typed
  // hostname used to become active immediately and could be auto-pushed to the
  // whole group before Save was ever pressed.
  S.tsHost=normalizeHost(val);
  if(proto)S.tsProto=proto;
  S.tsDraft=null;S.tsProtoDraft=null;
  invalidateChecks();
  if(S.tsHost)localStorage.setItem(TS_HOST_KEY,S.tsHost);else localStorage.removeItem(TS_HOST_KEY);
  localStorage.setItem(TS_PROTO_KEY,S.tsProto||"https");
  render();
}

// Take whatever a person pasted — "192.168.1.20", "192.168.1.20:8096/", "http://nas.local:8096/web/" —

  // name, or a whole URL — paste anything", and this is the shape that promise is

  // branch do the real work. Host:port with nothing after it is left alone, so

// Probe an app URL and resolve {ok, ms, blocked}.

//  • Mixed-content path (HTTPS page → http:// target): iOS/WebKit rejects
//    fetch() instantly for active mixed content, so every tile reads OFFLINE.
//    Image loads are "optionally blockable" mixed content and DO go out, so we
//    ping the host with an <img>. onload OR onerror = the host answered

// BE HONEST ABOUT WHAT THIS IS: a lock on the front door of the UI, not real

// ── HOME ─────────────────────────────────────────────────────────────────────
function buildHome(){
  const apps=S.apps,conf=apps.filter(a=>a.address),pend=apps.filter(a=>!a.address);
  const favs=apps.filter(a=>a.favorite&&a.address);
  const online=conf.filter(a=>S.status[a.id]==="online").length;
  const offline=conf.filter(a=>stDown(S.status[a.id])||S.status[a.id]==="slow").length;
  const checking=conf.filter(a=>S.status[a.id]==="checking").length;

  if(!apps.length)return`<div class="page"><div class="empty">
    <div class="empty-icon">🚀</div>
    <div class="empty-title">Welcome to NAS Hub</div>
    <div class="empty-sub">Tap ⚙️ then App Catalog to add your first app</div>
  </div></div>`;

  // NH-E-01: when every app on one machine is down, say so once instead of N times
  const byHost={};conf.forEach(a=>{const h=extractIp(a.address);if(!h||/^https?:/.test(a.address))return;(byHost[h]=byHost[h]||[]).push(a);});
  const hostsDown=Object.entries(byHost).filter(([h,as])=>as.length>=2&&as.every(a=>S.status[a.id]==="offline")).map(([h,as])=>({host:h,n:as.length,lastSeen:as.map(a=>getLastSeen(a.id)).filter(Boolean)[0]||null}));
  const mode=activeMode();
  // 4.17.0 (redesign phase 2): the Home / Away / Auto bar became one pill that opens a chooser.
  const netPill=S.tsHost
    ?`<button class="net-pill" onclick="openNetSheet()" aria-haspopup="dialog" aria-label="Network: ${mode==="away"?"Away":"Home"}${S.netMode==="auto"?", picked automatically":""}. Change">
        ${mode==="away"?"✈️":"🏠"}<span>${mode==="away"?"Away":"Home"}</span>${S.netMode==="auto"?`<span class="net-auto">Auto</span>`:""}<span class="net-chev" aria-hidden="true">⌄</span></button>`
    :`<button class="net-pill" onclick="go('tailscale')" aria-label="Home network. Set up Away, to reach your apps from anywhere">🏠<span>Home</span><span class="net-auto">Set up Away</span><span class="net-chev" aria-hidden="true">›</span></button>`;
  // Nothing answered at all this cycle. Rather than paint every tile red — which
  // is what made the old status untrustworthy — say the honest thing: we cannot
  // reach anything from here, and the tiles below are the last known state.
  const netBanner=S.netUnreachable?`<div class="banner" role="status">
      <h4>Can't reach anything from here</h4>
      <p>Every app failed to answer in the same check, so this is almost certainly the connection rather than ${conf.length} servers going down at once. The tiles below show the last state we could actually confirm${S.lastChecked?` (${S.lastChecked.toLocaleTimeString([],{hour:"2-digit",minute:"2-digit"})})`:""}.</p>
      <div class="acts"><span role="button" tabindex="0" onclick="recheck()">Try again</span>${S.tsHost&&mode!=="away"?`<span role="button" tabindex="0" onclick="setNetMode('away')">Use Tailscale (Away)</span>`:S.tsHost?"":`<span role="button" tabindex="0" onclick="go('tailscale')">Set up remote access</span>`}</div>
    </div>`:"";
  // The bridge lets us separate "the app is down" from "you can't get to it",
  // which the probe alone never could. Worth a banner of its own, because the
  // fix is completely different — nothing is wrong with the server.
  const unreach=conf.filter(a=>S.status[a.id]==="unreachable");
  const bridgeBanner=(unreach.length&&!S.netUnreachable)?`<div class="banner" role="status">
      <h4>${unreach.length===1?`${esc(unreach[0].name)} is running — you just can't reach it`:`${unreach.length} apps are running — you just can't reach them`}</h4>
      <p>Your NAS reported ${unreach.length===1?"it":"them"} as running${tnAgeText()?` (${esc(tnAgeText())})`:""}, but nothing answered from this device. So the app is fine and the route to it isn't: wrong network, Tailscale off, or the wrong port saved on the tile.</p>
      <div class="acts"><span role="button" tabindex="0" onclick="recheck()">Check again</span>${S.tsHost&&mode!=="away"?`<span role="button" tabindex="0" onclick="setNetMode('away')">Use Tailscale (Away)</span>`:!S.tsHost?`<span role="button" tabindex="0" onclick="go('tailscale')">Set up remote access</span>`:""}</div>
    </div>`:"";
  // Hardware first: a failing pool outranks an app that won't open, because one
  // of them can still be fixed and the other is already too late.
  const poolAlerts=tnPoolAlerts();
  const poolBannerHtml=a=>`<div class="banner${a.bad?" bad":""}" role="alert">
      <h4>${a.bad?"🛑 ":"⚠️ "}${esc(a.title)}</h4>
      <p>${esc(a.body)}</p>
      <div class="acts"><span role="button" tabindex="0" onclick="go('truenas')">What the NAS reported</span></div>
    </div>`;
  // Below every banner that reports an actual problem. Nobody wants to be asked
  // for a review directly above "Pool tank is DEGRADED".
  const hostBanners=hostsDown.map(d=>`<div class="banner" role="status">
      <h4>${esc(d.host)} isn't answering</h4>
      <p>${d.n} apps on it are down${d.lastSeen?` · last answered ${esc(d.lastSeen)}`:""}. Are you on your home Wi‑Fi? Is the NAS switched on?</p>
      <div class="acts"><span role="button" tabindex="0" onclick="recheck()">Check again</span>${S.tsHost&&mode!=="away"?`<span role="button" tabindex="0" onclick="setNetMode('away')">Use Tailscale (Away)</span>`:S.tsHost&&mode==="away"?`<span role="button" tabindex="0" onclick="setNetMode('home')">Use home addresses</span>`:`<span role="button" tabindex="0" onclick="go('tailscale')">Set up remote access</span>`}</div>
    </div>`);
  // 4.13.3 (audit 2026-11 P2): two or more yellow banners pushed every app below the first screen on a phone.
  // A failing pool (red) always shows in full; the rest fold into one line "N things to fix ›" that opens in place
  // and stays open across refreshes until it is closed again.
  const urgent=poolAlerts.filter(a=>a.bad).map(poolBannerHtml);
  const rest=[...poolAlerts.filter(a=>!a.bad).map(poolBannerHtml),netBanner,bridgeBanner,...hostBanners].filter(Boolean);
  const downBanners=urgent.join("")+(rest.length<2?rest.join(""):`<details class="banner-fold"${S.bannersOpen?" open":""} ontoggle="S.bannersOpen=this.open">
      <summary><span>⚠️ ${rest.length} things to fix</span><span class="bf-more" aria-hidden="true">›</span></summary>${rest.join("")}</details>`);
  const statusBar=conf.length?`${homeStatus(conf)}${downBanners}${buildRatePrompt()}
  ${tailscaleAllDown()?`<div class="banner" role="status"><h4>Tailscale may be off</h4><p>Every app on a Tailscale address stopped answering at once.</p>
    <div class="acts"><span role="button" tabindex="0" onclick="go('tailscale')">What to check</span></div></div>`:""}`:"";

  // 4.17.0: a favourite shows once, under Favorites, and is left out of the sections below it.
  const favBar=favs.length?`<section class="shelf" aria-labelledby="sh-fav">
    <h2 class="shelf-h" id="sh-fav">Favorites</h2>
    <div class="grid shelf-grid fixed">${favs.map(a=>buildTile(a)).join("")}</div>
  </section>`:"";
  const favIds=new Set(favs.map(a=>a.id));
  const notFav=a=>!favIds.has(a.id);

  const hasGroups=S.groups.length>0;
  let sections=[];
  if(hasGroups){
    S.groups.forEach(g=>{
      const gApps=apps.filter(a=>a.groupId===g.id&&notFav(a));
      if(gApps.length)sections.push({id:g.id,label:`${g.emoji} ${g.name}`,items:gApps});
    });
    const ungrouped=apps.filter(a=>(!a.groupId||!S.groups.find(g=>g.id===a.groupId))&&notFav(a));
    if(ungrouped.length)sections.push({id:"__other__",label:"Other",items:ungrouped});
  } else {
    const main=conf.filter(notFav);
    if(main.length)sections.push({id:"__conf__",label:favs.length?"Everything else":"Your apps",items:main});
    if(pend.length)sections.push({id:"__pend__",label:"Not set up yet",items:pend});
  }

  const sectHTML=sections.map(sec=>{
    const isCollapsed=S.collapsed[sec.id];
    return`<section class="shelf" aria-labelledby="sh-${esc(sec.id)}">
      <button class="shelf-h shelf-toggle" id="sh-${esc(sec.id)}" aria-expanded="${!isCollapsed}" onclick="toggleCollapse('${sec.id}')">
        <span>${esc(sec.label)}</span><span class="shelf-n">${sec.items.length}</span><span class="shelf-chev${isCollapsed?" collapsed":""}" aria-hidden="true">⌄</span>
      </button>
      ${!isCollapsed?`<div class="grid shelf-grid" data-sec-id="${sec.id}">${sec.items.map(a=>buildTile(a)).join("")}</div>`:""}
    </section>`;
  }).join("");

  return`<div class="page home">
    <div class="home-side">
      <div class="home-top">${netPill}</div>
      ${statusBar}${buildHttpsWarning()}
    </div>
    <div class="home-main">${favBar}${sectHTML}
      ${localStorage.getItem(HINT_KEY)?"":`<p class="hint">Tap an app for its sign-in, address and health. Hold and drag to rearrange.</p>`}
    </div>
  </div>
  <div class="home-bar${DEMO?" demo":""}">
    <button class="home-search" onclick="openPalette()" aria-label="Search apps and settings">🔍<span>Search apps and settings</span></button>
    <button class="home-add" onclick="go('catalog')" aria-label="Add an app" title="Add an app">＋</button>
  </div>
  ${S.netSheet?buildNetSheet():""}`;
}

// ── Home status line (4.17.0) ─────────────────────────────────────────────────
// One sentence instead of a dot on every tile. Names the broken apps, offers one fix.
function statusFacts(conf){
  const n=conf.length;
  const st=a=>S.status[a.id];
  const checking=conf.filter(a=>st(a)==="checking").length;
  const down=conf.filter(a=>stDown(st(a)));
  const slow=conf.filter(a=>st(a)==="slow");
  const up=conf.filter(a=>st(a)==="online"||st(a)==="slow").length;   // slow still answers
  const names=list=>{const ns=list.map(a=>esc(a.name));return ns.length<=2?ns.join(" and "):`${ns.slice(0,2).join(", ")} and ${ns.length-2} more`;};
  const firstRun=!S.lastChecked&&(checking>0||!Object.keys(S.status).length);
  let head,line="",tone="";
  if(firstRun||(rechecking&&!down.length)){head="Checking your apps…";}
  else if(!down.length&&up===n){head=n===1?"Your app is up":`All ${n} apps are up`;}
  else{head=`${up} of ${n} app${n===1?" is":"s are"} up`;}
  if(!firstRun){
    if(down.length){tone="bad";line=`${names(down)} ${down.length===1?"isn't":"aren't"} answering.`;}
    else if(slow.length){tone="warn";line=`${names(slow)} ${slow.length===1?"is":"are"} slow to answer.`;}
  }
  const when=S.lastChecked?`Checked ${S.lastChecked.toLocaleTimeString([],{hour:"2-digit",minute:"2-digit"})}`:"";
  return{head,line,tone,when,busy:!!(rechecking||checking)};
}
function homeStatus(conf){
  const f=statusFacts(conf);
  // 4.18.0: the sentence opens the list of every app with its address and recent checks
  return`<div class="home-status" role="status" aria-live="polite">
    <h1 class="home-head"><button class="home-head-btn" onclick="go('status')" aria-label="${f.head}. See every app with its address and recent checks">${f.head}<span class="home-chev" aria-hidden="true">›</span></button></h1>
    <div class="home-line">
      ${f.line?`<span class="home-mark ${f.tone}" aria-hidden="true"></span><span>${f.line}</span>`:`<span class="home-when">${f.when}</span>`}
      <button class="home-again" onclick="recheck()"${f.busy?" disabled":""}>${f.busy?"Checking…":"Check again"}</button>
    </div>
  </div>`;
}

// ── Status list (4.18.0, redesign phase 3) ────────────────────────────────────
// Every app with its address. Only the apps with a problem show their recent checks;
// the rest are plain rows, so a healthy NAS reads as one calm list.
function statusTrouble(st){return stDown(st)||["slow","unreachable","blocked","deploying"].includes(st);}
function buildStatus(){
  const apps=S.apps,conf=apps.filter(a=>a.address),pend=apps.filter(a=>!a.address);
  const f=statusFacts(conf);
  const byName=(a,b)=>a.name.localeCompare(b.name);
  const trouble=conf.filter(a=>statusTrouble(S.status[a.id]));
  const fine=conf.filter(a=>!statusTrouble(S.status[a.id])).sort(byName);
  const addr=a=>{const u=buildUrl(a);return u?u.replace(/^https?:\/\//,"").replace(/\/$/,""):"";};
  const row=(a,click,right)=>`<button class="st-row" onclick="${click}">
      <span class="plate st-plate" style="--ic:${esc(a.color||"#4b7fff")}">${plateIcon(a)}</span>
      <span class="st-name1">${esc(a.name)}</span>
      <span class="st-addr">${right}</span>
      <span class="st-chev" aria-hidden="true">›</span>
    </button>`;
  const card=a=>{const s=S.status[a.id];const bad=stDown(s);return`<div class="st-card${bad?" bad":" warn"}">
      <button class="st-row st-row-in" onclick="tapTile('${a.id}')">
        <span class="plate st-plate" style="--ic:${esc(a.color||"#4b7fff")}">${plateIcon(a)}</span>
        <span class="st-name">${esc(a.name)}<small>${esc(addr(a))}</small></span>
        <span class="st-chev" aria-hidden="true">›</span>
      </button>
      <p class="st-why">${esc(stShort(s))}${bad&&getLastSeen(a.id)?` · last answered ${esc(getLastSeen(a.id))}`:""}</p>
      <div class="st-strip">${buildHealthBars(a.id)}</div>
    </div>`;};
  if(!apps.length)return`<div class="page st-page"><h1 class="st-h">No apps yet</h1>
    <p class="st-sub">Add one with the + on the home screen.</p></div>`;
  return`<div class="page st-page">
    <h1 class="st-h">${f.head}</h1>
    <div class="home-line">
      <span>${f.when?f.when+" · ":""}checks run every minute</span>
      <button class="home-again" onclick="recheck()"${f.busy?" disabled":""}>${f.busy?"Checking…":"Check again"}</button>
    </div>
    ${trouble.length?`<section class="st-sec"><h2 class="shelf-h st-attn">Needs attention</h2>${trouble.map(card).join("")}</section>`:""}
    ${fine.length?`<section class="st-sec"><h2 class="shelf-h">${trouble.length?`${fine.length} answering`:`All ${fine.length} answering`}</h2>
      <div class="st-list">${fine.map(a=>row(a,`tapTile('${a.id}')`,esc(addr(a)))).join("")}</div></section>`:""}
    ${pend.length?`<section class="st-sec"><h2 class="shelf-h">Not set up yet</h2>
      <div class="st-list">${pend.sort(byName).map(a=>row(a,`editApp('${a.id}')`,"No address")).join("")}</div></section>`:""}
  </div>`;
}

// ── Drag a bottom sheet down to close it (4.18.0) ──────────────────────────────
// Only from the grab bar or the title row, so scrolling inside the sheet still scrolls.
(function(){
  let sh=null,y0=0,dy=0;
  document.addEventListener("touchstart",e=>{
    const h=e.target.closest&&e.target.closest(".sheet-grab,.sheet-head,.qa-head");
    if(!h||e.touches.length!==1)return;
    sh=h.closest(".sheet");if(!sh)return;y0=e.touches[0].clientY;dy=0;sh.style.transition="none";
  },{passive:true});
  document.addEventListener("touchmove",e=>{
    if(!sh)return;dy=Math.max(0,e.touches[0].clientY-y0);sh.style.transform=`translateY(${dy}px)`;
  },{passive:true});
  document.addEventListener("touchend",()=>{
    if(!sh)return;const s=sh;sh=null;s.style.transition="";
    if(dy>90){if(_ask)answerAsk(false);else if(S.iconPick!=null)closeIconPicker();else if(S.restoreSheet)closeRestoreSheet();else if(S.hostEdit&&S.view==="hosts")cancelHostEdit();else if(S.qaApp)closeQA();else if(S.netSheet)closeNetSheet();}else s.style.transform="";
  },{passive:true});
})();

// A group's own colour as text: fine on the dark ground, darkened for the light one (BUG-NH-012)
function gc(c){return S.lightMode?`color-mix(in srgb,${c||"#4b7fff"} 55%,#141a2e)`:(c||"#4b7fff");}
function hexRgba(hex,a){
  const c=(asText(hex)||"#4b7fff").replace("#","").padEnd(6,"0");
  const r=parseInt(c.slice(0,2),16),g=parseInt(c.slice(2,4),16),b=parseInt(c.slice(4,6),16);
  return"rgba("+r+","+g+","+b+","+a+")";
}
// ── One table that decides what a status looks like ──────────────────────────
// This used to be a ternary chain repeated in six screens, so adding a status
// meant finding all six. The NAS bridge adds three at once, so it is a table.
// c = dot colour · lbl = the shout on a tile · sh = the label in a panel ·
// word = the whole truth, for screen readers and anywhere with room for it.
const ST={
  online:     {c:"#00e87a",lbl:"",         sh:"Online",          word:"online"},
  slow:       {c:"#FFC300",lbl:"SLOW",     sh:"Slow",            word:"slow"},
  offline:    {c:"#ff5050",lbl:"OFFLINE",  sh:"Offline",         word:"offline",dim:1},
  crashed:    {c:"#ff5050",lbl:"CRASHED",  sh:"Crashed on NAS",  word:"crashed on the NAS",dim:1},
  stopped:    {c:"#ff9040",lbl:"STOPPED",  sh:"Stopped on NAS",  word:"stopped on the NAS",dim:1},
  deploying:  {c:"#4b7fff",lbl:"STARTING", sh:"Starting up",     word:"starting up on the NAS"},
  unreachable:{c:"#8a93c2",lbl:"NO ROUTE", sh:"Running · no route from here",word:"running on the NAS, but not reachable from here"},
  blocked:    {c:"#FFC300",lbl:"BLOCKED",  sh:"Blocked",         word:"blocked by the browser"},
  checking:   {c:"#5555cc",lbl:"",         sh:"Checking…",       word:"checking"}
};
function stCol(st,fb){return (ST[st]||{}).c||fb||"#3a3a5c";}
function stLbl(st){return (ST[st]||{}).lbl||"";}
function stShort(st){return (ST[st]||{}).sh||"—";}
function stWord(st){return (ST[st]||{}).word||"unknown";}
function stDown(st){return !!(ST[st]||{}).dim;}                 // genuinely down, not just unreachable
function stDot(st,cls){
  if(st==="checking")return`<div class="${cls||"sdot"} checking"></div>`;
  return ST[st]?`<div class="${cls||"sdot"}" style="background:${ST[st].c}"></div>`:"";
}

// 4.17.0 (redesign phase 2): an icon on a plate and a name. No dot, star, coloured edge or bars:
// the status sentence above the shelf carries that. A down app greys out and gets a "Down" badge.
function buildTile(app){
  const st=S.status[app.id]||"idle",url=buildUrl(app);
  const down=stDown(st),col=app.color||"#4b7fff";
  const note=!url?"No address":
    (down?"":(stLbl(st)?stShort(st):""))||
    ((S.live[app.id]&&S.live[app.id].line)?S.live[app.id].line:"");
  return`<div class="tile qtile${url?"":" dim"}${down?" down":""}" role="button" tabindex="0" aria-label="${esc(app.name)}, ${url?stWord(st):"no address yet"}${app.favorite?", favourite":""}" data-app-id="${app.id}" onclick="tapTile('${app.id}')">
    <span class="plate" style="--ic:${esc(col)}">${plateIcon(app)}${down?`<span class="down-badge">Down</span>`:""}</span>
    <span class="qname">${esc(app.name)}</span>
    ${note?`<span class="qnote${!url?" add":""}">${esc(note)}</span>`:""}
  </div>`;
}

// Jellyfin Monitor entry point lives on the Jellyfin tile itself.
function buildJfBadge(){
  const configured=!!(S.jellyfin.url&&S.jellyfin.apiKey);
  const n=S.jfSessions.length;
  const cls=!configured?"setup":n?"live":"";
  const label=!configured?"MONITOR":S.jfStatus==="online"?(n?`▶ ${n} PLAYING`:"● IDLE"):S.jfStatus==="checking"?"…":"MONITOR";
  return`<div class="jf-badge ${cls}" role="button" tabindex="0" title="Jellyfin Monitor" aria-label="Jellyfin Monitor" onclick="event.stopPropagation();go('jellyfin')">${label}</div>`;
}
// Slow background poll so the tile badge stays live on the home screen
// (the 4s poll only runs inside the monitor view).
setInterval(()=>{
  if(document.hidden||S.view!=="home"||S.jfPollTimer)return;
  if(!S.jellyfin.url||!S.jellyfin.apiKey)return;
  const before=S.jfSessions.length+"|"+S.jfStatus;
  jellyfinPoll().then(()=>{if(before!==S.jfSessions.length+"|"+S.jfStatus&&S.view==="home")render();}).catch(()=>{});
},30000);
setTimeout(()=>{if(S.jellyfin.url&&S.jellyfin.apiKey)jellyfinPoll().then(()=>{if(S.view==="home")render();}).catch(()=>{});},2500);

// ── QUICK ACTIONS ─────────────────────────────────────────────────────────────
function buildQA(){
  const app=S.qaApp;if(!app)return"";
  const url=buildUrl(app),st=S.status[app.id]||"idle";
  const links=DEEP_LINKS[app.id]||[];
  const stColor=stCol(st,"var(--t3)");

  // Health data
  const uptime=getUptime(app.id);
  const avgMs=getAvgMs(app.id);
  const lastSeen=getLastSeen(app.id);
  const histLen=(S.health[app.id]||[]).length;
  const uptimeColor=uptime===null?"var(--t3)":uptime>=90?"var(--ok)":uptime>=70?"var(--warn)":"var(--bad)";
  const msColor=avgMs===null?"var(--t3)":avgMs<300?"var(--ok)":avgMs<1500?"var(--warn)":"var(--bad)";

  const lv=S.live[app.id];
  const liveSection=lv&&(lv.detail||lv.error)?`<div style="margin:12px 0 2px;background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:12px 14px">
      <div class="lbl" style="margin-bottom:8px">⚡ Live${lv.ts?` · ${new Date(lv.ts).toLocaleTimeString([],{hour:"2-digit",minute:"2-digit"})}`:""}</div>
      ${lv.error?`<div style="font-size:12px;color:var(--warn2);line-height:1.5">${esc(lv.error)}</div>`:(lv.detail||[]).map(([k,v])=>`<div style="display:flex;justify-content:space-between;padding:5px 0;border-bottom:1px solid var(--line);font-size:13px"><span style="color:var(--t2)">${esc(k)}</span><span style="font-family:'IBM Plex Mono',ui-monospace,monospace;font-size:12px;color:var(--t1)">${esc(v)}</span></div>`).join("")}
    </div>`:(WIDGETS[app.id]&&url&&!app.apiKey?`<div style="margin:12px 0 2px;font-size:12px;color:var(--t3);line-height:1.5">Add an API key (✏️ Edit) to see live info here — ${WIDGETS[app.id].hint}.</div>`:"");
  const uptimeSection=url?buildUptimePanel(app.id):"";
  const pf=S.portFind&&S.portFind.id===app.id?S.portFind:null;
  const canFind=!!url&&!/^https?:/i.test(String(app.address||""))&&(pf||["offline","unreachable","slow"].includes(st));
  const findSection=canFind?`<div style="margin:12px 0 2px;background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:12px 14px">
      <div class="lbl" style="margin-bottom:6px">🔎 Moved to a different port?</div>
      ${!pf?`<div style="font-size:12px;color:var(--t2);line-height:1.5;margin-bottom:8px">If ${esc(app.name)} was reinstalled or its port changed, NAS Hub can look for it on ${esc(extractIp(String(app.address||"")))}: the ports it used before, its usual port, and the ports next to ${esc(app.port)}.</div>
        <button class="btn-cat" style="margin:0" onclick="findMovedPort('${app.id}')">Look for it</button>`
      :pf.running?`<div style="font-size:12px;color:var(--t2)" role="status">Checking ${pf.checked} of ${pf.total} ports…</div>`
      :pf.unsure?`<div style="font-size:12px;color:var(--warn2);line-height:1.5">This page can't tell which ports really answer, because it's a secure page checking a plain http address. Open NAS Hub from your NAS's own address at home and try again, or check the port in your NAS's app settings.</div>`
      :pf.found.length?`<div style="font-size:12px;color:var(--t2);margin-bottom:8px">Something answers on ${pf.found.length===1?"this port":"these ports"}:</div>
        ${pf.found.map(port=>`<button class="btn-cat" style="margin:0 0 6px" onclick="useFoundPort('${app.id}',${port})">Use port ${port}</button>`).join("")}
        <div style="font-size:11px;color:var(--t3);line-height:1.5">Any service answers, so open it first if you're not sure it's ${esc(app.name)}.</div>`
      :`<div style="font-size:12px;color:var(--t2);line-height:1.5">Nothing answered on the ${pf.total} likely ports. Check the port in your NAS's app settings, then ✏️ Edit.</div>`}
    </div>`:"";
  const healthSection=url?`
    <div style="margin:14px 0 2px">
      <h3 class="qa-lbl">Recent checks${histLen?` · last ${histLen}`:""}</h3>
      ${histLen?`<div class="h-stats">
        <div class="h-stat">
          <div class="h-stat-val" style="color:${uptimeColor}">${uptime}%</div>
          <div class="h-stat-lbl">Uptime</div>
        </div>
        <div class="h-stat">
          <div class="h-stat-val" style="color:${msColor}">${avgMs!==null?avgMs+"ms":"—"}</div>
          <div class="h-stat-lbl">Avg Speed</div>
        </div>
        <div class="h-stat">
          <div class="h-stat-val" style="color:var(--muted);font-size:${lastSeen&&lastSeen.length>6?"13":"17"}px;padding-top:${lastSeen&&lastSeen.length>6?"3":"0"}px">${lastSeen||"—"}</div>
          <div class="h-stat-lbl">Last Online</div>
        </div>
      </div>`:""}
      ${buildHealthBars(app.id)}
    </div>`:"";

  // 4.18.0 (redesign phase 3): a bottom sheet, same contents as before, in the new look.
  const stTone=st==="online"?"var(--up-text)":stDown(st)?"var(--down-text)":"var(--muted)";
  const where=(url||"").replace(/^https?:\/\//,"").replace(/\/$/,"");
  return`<div class="sheet-scrim" onclick="closeQA()"></div>
  <div class="sheet qa-sheet fade-in" role="dialog" aria-modal="true" aria-labelledby="qa-h" data-close="closeQA">
    <div class="sheet-grab" aria-hidden="true"></div>
    <div class="qa-head">
      <span class="plate qa-plate" style="--ic:${esc(app.color||"#4b7fff")}">${plateIcon(app)}</span>
      <div class="qa-title"><h2 id="qa-h">${esc(app.name)}</h2>
        <div class="qa-st" style="color:${stTone}"><span class="qa-dot" style="background:${stColor}"></span>${url?stShort(st):"No address yet"}${S.times[app.id]?`<span class="qa-ms">${S.times[app.id]} ms</span>`:""}</div>
      </div>
      <button class="sheet-x" onclick="closeQA()" aria-label="Close">✕</button>
    </div>
    <div class="qa-card">
      <h3 class="qa-lbl">Saved sign-in, copy before opening</h3>
      ${!(app.username||app.password)?`<div class="qa-row"><span class="qa-muted">No saved credentials for this app</span><button class="qa-link" onclick="editFromQA('${app.id}')">Add</button></div>`:""}
      ${app.username?`<div class="qa-row"><span class="qa-k">Username</span><span class="qa-v">${esc(app.username)}</span>
        <button class="qa-link" onclick="withBiometric(()=>copyText(S.qaApp?.username||'','Username'))">Copy</button></div>`:""}
      ${app.password?`<div class="qa-row"><span class="qa-k">Password</span><span class="qa-v" id="qa-pw-disp">••••••••</span>
        <button class="qa-link qa-eye" aria-label="Show or hide the password" onclick="withBiometric(()=>{const d=document.getElementById('qa-pw-disp');if(d)d.textContent=d.textContent==='••••••••'?(S.qaApp?.password||''):'••••••••';})">👁</button>
        <button class="qa-link" onclick="withBiometric(()=>copyText(S.qaApp?.password||'','Password'))">Copy</button></div>`:""}
    </div>
    ${(url&&isHttpsApp(app)&&getOfflineStreak(app.id)>=3)?`<div class="qa-warn">
      <strong>May be blocked by an untrusted certificate</strong>
      <p>This app has failed ${getOfflineStreak(app.id)} checks in a row but may still work. Open it directly once and accept any security warning; then the checks should succeed.</p>
      <button class="qa-link" onclick="openUrlOf('${app.id}')">Open and accept the certificate</button>
    </div>`:""}
    ${url?`<button class="qa-primary" onclick="openUrlOf('${app.id}');closeQA()">Open ${esc(app.name)}</button>`:""}
    ${links.length?`<div><h3 class="qa-lbl">Jump straight to</h3>
      <div class="qa-pills">${links.slice(0,6).map((l,li)=>`<button class="qa-pill" onclick="${url?`openUrlOf('${app.id}',${li});closeQA()`:""}"${url?"":" disabled"}>${l.icon} ${l.label}</button>`).join("")}</div></div>`:""}
    ${url?`<div class="qa-card qa-addr"><div><span class="qa-k">${activeMode()==="away"&&S.tsHost?"Away address":"Address"}</span><span class="qa-v">${esc(where)}</span></div>
      <button class="qa-link" onclick="copyUrlOf('${app.id}')" aria-label="Copy the link to ${esc(app.name)}">Copy</button></div>`
      :`<div class="qa-card qa-addr"><span class="qa-muted">No address yet. Add one to open ${esc(app.name)} from here.</span><button class="qa-link" onclick="editFromQA('${app.id}')">Add</button></div>`}
      ${liveSection}
      ${findSection}
      ${healthSection}
      ${uptimeSection}
      ${isTailscaleIp(app.address||"")?`<div class="qa-card qa-ts">
        <div class="qa-row"><span class="qa-k">Tailscale</span><span class="qa-v">${esc(extractIp(app.address||""))}</span><button class="qa-link" onclick="go('tailscale');closeQA()">Guide</button></div>
        <p class="qa-muted">${tailscaleAllDown()?"Every Tailscale app is offline. Tailscale may be off on this device.":"Works anywhere you have Tailscale connected."}</p>
      </div>`:""}
      ${UPLOAD_APPS[app.id]&&url?`<button class="qa-secondary" onclick="quickUpload('${app.id}')">${UPLOAD_APPS[app.id].icon} ${UPLOAD_APPS[app.id].label}</button>`:""}
      <div class="qa-foot">
        <button class="qa-secondary" onclick="toggleFav('${app.id}');closeQA()" aria-pressed="${!!app.favorite}"><span class="qa-star${app.favorite?" on":""}" aria-hidden="true">★</span>${app.favorite?"Favourite":"Add to favourites"}</button>
        <button class="qa-secondary" onclick="editFromQA('${app.id}')">Edit</button>
      </div>
      ${app.notes?`<div class="qa-card qa-notes"><h3 class="qa-lbl">Notes</h3><p>${esc(app.notes)}</p></div>`:""}
  </div>`;
}

// ── MANAGE ────────────────────────────────────────────────────────────────────
// The Manage screen used to be seventeen flat buttons under one heading, then
// Backup, then a spreadsheet importer, then every app with reorder arrows — one
// scroll, no structure. Dave (2026-09-16): "it seems really long … opportunities
// to group some of the items together." Those seventeen buttons were six jobs
// wearing one coat, so that is how they are laid out now. Each section remembers
// whether you left it open. The app list moved to its own screen; it duplicated
// the home grid, which already has hold-and-drag.
function mgIsOpen(k){
  if(S.mgOpen&&k in S.mgOpen)return !!S.mgOpen[k];
  return k==="add"&&S.apps.length===0;      // fresh install: only "Add apps" open
}
function toggleMg(k){
  S.mgOpen={...(S.mgOpen||{}),[k]:!mgIsOpen(k)};
  localStorage.setItem(MANAGE_KEY,JSON.stringify(S.mgOpen));
  render();
}
function mgSection(k,icon,title,summary,body){
  const open=mgIsOpen(k);
  return`<div class="mg-sec${open?" open":""}">
    <button class="mg-hd" onclick="toggleMg('${k}')" aria-expanded="${open}" aria-controls="mg-${k}">
      <span>${icon}</span><span>${title}</span>
      ${summary?`<span class="mg-sum">${summary}</span>`:""}
      <span class="mg-chev">›</span>
    </button>
    ${open?`<div class="mg-body" id="mg-${k}">${body}</div>`:""}
  </div>`;
}
const _sub=t=>`<span style="color:var(--t2);font-weight:400;font-size:13px">${t}</span>`;
const _pill=(t,c)=>`<span style="color:${c};font-size:12px;float:right">${t}</span>`;

function mgSummary(){
  const nApps=S.apps.length,nGroups=S.groups.length,nHosts=hostGroups().length;
  const jfReady=!!(S.jellyfin.url&&S.jellyfin.apiKey);
  const tsOn=!!(S.tsHost||getTailscaleSubnet());
  const alOn=!!(S.alerts&&S.alerts.subscribed);
  return{nApps,nGroups,nHosts,jfReady,tsOn,alOn};
}
const _pl=(n,w)=>`${n} ${w}${n===1?"":"s"}`;
// One row in a Manage list. `act` is an onclick string; `href` makes it a link.
function mgRow(o){
  const inner=`<span class="mg-ic" aria-hidden="true">${o.ic}</span>
    <span class="mg-txt"><span class="mg-lbl">${o.label}</span>${o.desc?`<span class="mg-desc">${o.desc}</span>`:""}</span>
    ${o.val?`<span class="mg-val${o.on?" on":""}">${o.val}</span>`:""}
    ${o.sw!=null?`<span class="sw${o.sw?"":" off"}" aria-hidden="true"></span>`:`<span class="mg-chev" aria-hidden="true">›</span>`}`;
  if(o.href)return`<a class="mg-row" href="${o.href}" target="_blank" rel="noopener">${inner}</a>`;
  return`<button class="mg-row"${o.sw!=null?` role="switch" aria-checked="${!!o.sw}"`:""}${o.dis?" disabled":""} onclick="${o.act}">${inner}</button>`;
}
const mgList=(h,rows)=>`<section class="mg-group">${h?`<h2 class="mg-h">${h}</h2>`:""}<div class="mg-list">${rows.join("")}</div></section>`;

  return`<div class="page mg-page">

    ${mgList("Your apps",[
      mgRow({ic:"➕",label:"Add apps",val:m.nApps?_pl(m.nApps,"app"):"Start here",act:"go('mg-add')"}),

// ── Ask before doing something, as a sheet instead of the browser's box (4.19.0) ──
// Returns a promise of true/false. The message keeps the app's existing wording:
// the first paragraph becomes the question, the rest the explanation.
let _ask=null;
function askSheet(msg,opt){
  opt=opt||{};
  const parts=String(msg).split(/\n\n/);
  const title=parts.shift(),body=parts.join("\n\n");
  const ok=opt.ok||(/^Delete/.test(title)?"Delete":/^Leave/.test(title)?"Leave group":/^Remove/.test(title)?"Remove":/^Restore/.test(title)?"Restore":/^Make a new/.test(title)?"Make a new token":/^Let /.test(title)?"Allow":"OK");
  const danger=opt.danger!=null?opt.danger:/^(Delete|Leave|Remove)/.test(title);
  if(_ask)_ask.res(false);
  return new Promise(res=>{
    _ask={title,body,ok,danger,res,back:document.activeElement};
    render();
    setTimeout(()=>{const b=document.querySelector(".ask-sheet .ask-ok");if(b)b.focus();},40);
  });
}
function answerAsk(v){
  const a=_ask;if(!a)return;_ask=null;render();
  try{if(a.back&&a.back.isConnected)a.back.focus();}catch(e){}
  a.res(!!v);
}
function buildAsk(){
  const a=_ask;
  return`<div class="sheet-scrim ask-scrim" onclick="answerAsk(false)"></div>
  <div class="sheet ask-sheet" role="alertdialog" aria-modal="true" aria-labelledby="ask-h" aria-describedby="ask-b">
    <div class="sheet-grab" aria-hidden="true"></div>
    <div class="sheet-head"><h2 id="ask-h">${esc(a.title)}</h2></div>
    ${a.body?`<p class="sheet-sub" id="ask-b">${esc(a.body).replace(/\n/g,"<br>")}</p>`:`<span id="ask-b"></span>`}
    <button class="mg-btn ask-ok${a.danger?" danger":" primary"}" onclick="answerAsk(true)">${esc(a.ok)}</button>
    <button class="mg-btn ask-no" onclick="answerAsk(false)">Cancel</button>
  </div>`;
}

// Keyboard: arrow keys move the row and keep focus on its handle.
function aaKey(e,i){
  const d=e.key==="ArrowUp"?-1:e.key==="ArrowDown"?1:0;if(!d)return;
  e.preventDefault();if(i+d<0||i+d>=S.apps.length)return;
  moveApp(i,d);
  setTimeout(()=>{const h=document.querySelector(`.aa-handle[data-aa="${i+d}"]`);if(h)h.focus();},20);
}
// Pointer: the row follows the finger; rows are moved in the page while dragging
// and the new order is saved once, when the finger lifts.
function aaDragStart(e){
  const h=e.currentTarget,row=h.closest(".aa-row"),list=document.getElementById("aa-list");
  if(!row||!list||(e.pointerType==="mouse"&&e.button!==0))return;
  e.preventDefault();
  row.classList.add("dragging");
  renderBlocked=true;   // a status check redrawing mid-drag would drop the row
  let moved=false;
  // The neighbours move, never the dragged row itself: moving the row would make
  // the browser drop the pointer. Listening on window keeps the lift-off even if
  // the finger slides off the handle.
  const mv=ev=>{
    const y=ev.clientY;
    const nx=row.nextElementSibling,pv=row.previousElementSibling;
    if(nx){const b=nx.getBoundingClientRect();if(y>b.top+b.height/2){list.insertBefore(nx,row);moved=true;return;}}
    if(pv){const b=pv.getBoundingClientRect();if(y<b.top+b.height/2){list.insertBefore(pv,row.nextSibling);moved=true;}}
  };
  const up=()=>{
    window.removeEventListener("pointermove",mv);window.removeEventListener("pointerup",up);window.removeEventListener("pointercancel",up);
    row.classList.remove("dragging");
    renderBlocked=false;
    if(!moved){if(renderPending){renderPending=false;render();}return;}
    const ids=[...list.querySelectorAll(".aa-row")].map(r=>r.dataset.id);
    const by=Object.fromEntries(S.apps.map(a=>[a.id,a]));
    const next=ids.map(id=>by[id]).filter(Boolean);
    if(next.length===S.apps.length){S.apps=next;save();}
    renderPending=false;render();
  };
  window.addEventListener("pointermove",mv);window.addEventListener("pointerup",up);window.addEventListener("pointercancel",up);
}

// A fixed palette is always one icon short of what somebody wants, and every
// addition means another release. Take whatever is typed or pasted instead: keep
// the first grapheme, so a flag or a skin-tone variant survives as one character
// rather than being sliced in half, and cap it at the 8 UTF-16 units the sync
// sanitiser allows — longer than that and the icon would arrive mangled on the
// other person's phone.
function firstEmoji(v){
  const raw=String(v==null?"":v).replace(/[<>]/g,"").trim();
  if(!raw)return"";
  let g;
  try{
    g=(typeof Intl!=="undefined"&&Intl.Segmenter)
      ? ([...new Intl.Segmenter(undefined,{granularity:"grapheme"}).segment(raw)][0]||{}).segment
      : [...raw][0];
  }catch(e){ g=[...raw][0]; }
  g=g||raw;
  return g.length>8?([...g][0]||""):g;
}
function setEditEmoji(v){
  if(!S.editApp)return;
  S.editApp.emoji=firstEmoji(v)||S.editApp.emoji;
  render();
}
function setGroupEmoji(v){
  if(!S.editGroup)return;
  S.editGroup.emoji=firstEmoji(v)||S.editGroup.emoji;
  render();
}
