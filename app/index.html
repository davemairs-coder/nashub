    <button class="btn-save" onclick="saveEdit()">${a._isNew?"Add to NAS Hub":"Save Changes"}</button>
    ${!a._isNew?`<button class="btn-fav${a.favorite?" on":""}" onclick="S.editApp.favorite=!S.editApp.favorite;render()">${a.favorite?"★ Remove from Favorites":"☆ Add to Favorites"}</button>
    <button class="btn-fav" onclick="moveToTop()">⬆ Move to top of its group</button>
    <button class="btn-del" onclick="deleteApp()">Remove App</button>`:""}
    <button class="btn-can" onclick="${a._isNew?(a._fromCatalog?"go('catalog')":"go('home')"):"goBack()"}">Cancel</button>
  </div>`;
}

function openIconPicker(){if(!S.editApp)return;const lg=logoOf(S.editApp);S.iconPick=lg?"logo:"+lg:(S.editApp.emoji||"🌐");render();setTimeout(()=>{const c=document.querySelector('.ip-cell[aria-checked="true"]')||document.querySelector('.ip-cell');if(c)c.focus();},40);}
function closeIconPicker(){S.iconPick=null;render();}
function useIconPick(){const p=S.iconPick;if(S.editApp&&p){if(p.startsWith("logo:")&&LOGOS.has(p.slice(5)))S.editApp.logo=p.slice(5);else{S.editApp.emoji=p;S.editApp.logo="none";}}S.iconPick=null;render();}
function pickIconOwn(v){const e=firstEmoji(v);if(!e)return;S.iconPick=e;const pv=document.getElementById("ip-prev");if(pv){pv.textContent=e;}document.querySelectorAll(".ip-cell").forEach(c=>c.setAttribute("aria-checked",String(c.dataset.e===e)));}
function buildIconPicker(){
  const a=S.editApp,cur=S.iconPick;
  return`<div class="sheet-scrim" onclick="closeIconPicker()"></div>
  <div class="sheet ip-sheet" role="dialog" aria-modal="true" aria-labelledby="ip-h">
    <div class="sheet-grab" aria-hidden="true"></div>
    <div class="sheet-head"><h2 id="ip-h">Choose an icon</h2><button class="sheet-x" onclick="closeIconPicker()" aria-label="Close">✕</button></div>
    <h3 class="ip-sub" id="ip-logos-h">App logos</h3>
    <div class="ip-grid ip-logos" role="radiogroup" aria-labelledby="ip-logos-h">${[...LOGOS].map(k=>{const nm=(CATALOG.find(c=>c.id===k)||{}).name||LOGO_LABEL[k]||k;
      return`<button class="ip-cell" role="radio" data-e="logo:${k}" aria-checked="${cur==="logo:"+k}" aria-label="${esc(nm)} logo" onclick="S.iconPick='logo:${k}';render()"><img class="logo" src="logos/${k}.svg" alt=""></button>`;}).join("")}</div>
    <h3 class="ip-sub" id="ip-icons-h">Simple icons</h3>
    <div class="ip-grid" role="radiogroup" aria-labelledby="ip-icons-h">${CUSTOM_EMOJIS.map(e=>{const n=(LI_EMOJI[e.replace(/️/g,"")]||"icon").replace(/-/g," ");
      return`<button class="ip-cell" role="radio" data-e="${esc(e)}" aria-checked="${cur===e}" aria-label="${esc(n)}" onclick="S.iconPick='${e}';render()">${e}</button>`;}).join("")}</div>
    <div class="ip-own">
      <span class="plate ip-prev" style="--ic:${esc(a.color)}" id="ip-prev" aria-hidden="true">${cur.startsWith("logo:")?`<img class="logo" src="logos/${esc(cur.slice(5))}.svg" alt="">`:esc(cur)}</span>
      <div style="flex:1;min-width:0"><label class="flbl" for="ip-own-inp" style="margin-top:0">Or type any emoji</label>
      <input class="inp" id="ip-own-inp" style="margin:0" oninput="pickIconOwn(this.value)" autocomplete="off" aria-describedby="ip-hint">
      <p class="ed-note" id="ip-hint" style="margin:4px 0 0">On a phone, use the emoji key. On a Mac, press ⌃⌘Space.</p></div>
    </div>
    <button class="mg-btn primary" onclick="useIconPick()">Use this icon</button>
  </div>`;
}

      <div style="display:flex;align-items:center;gap:8px;margin-top:8px">

      <div style="display:flex;gap:8px;margin-top:14px">

// ── TAILSCALE GUIDE ───────────────────────────────────────────────────────────
function buildJellyfin(){
  const cfg=S.jellyfin;
  const configured=cfg.url&&cfg.apiKey;
  const st=S.jfStatus;
  const dotColor=st==="online"?"#00e87a":st==="offline"?"#ff5050":st==="blocked"?"#FFC300":st==="checking"?"#4b7fff":"#555";
  const stLabel=st==="online"?"Online":st==="offline"?"Offline":st==="blocked"?"Blocked":st==="checking"?"Checking…":"Not configured";

  // ── Config card ──
  const configCard=`
    <div style="background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:14px;margin-bottom:16px">
      <div class="lbl" style="margin-bottom:8px">🎬 Jellyfin Connection</div>
      <input class="inp" id="jf-url-inp" style="margin-bottom:8px" placeholder="e.g. 192.168.1.20:8096 or https://mynas.tailnet.ts.net:8096"
        value="${cfg.url||""}" oninput="S.jellyfin.url=this.value" autocomplete="off">
      <input class="inp" id="jf-key-inp" style="margin-bottom:6px" placeholder="API key (Dashboard → Advanced → API Keys)"
        value="${cfg.apiKey||""}" oninput="S.jellyfin.apiKey=this.value" autocomplete="off">
      ${(cfg.apiKey||"").trim().startsWith("sk-")?`<div style="font-size:11px;color:var(--warn);margin:-4px 0 8px;padding:6px 10px;background:var(--surface);border-radius:6px;line-height:1.5">⚠️ That looks like an OpenAI key, not a Jellyfin API key. Jellyfin keys are 32 letters/numbers from Jellyfin → Dashboard → API Keys. (The AI key has its own field in Diagnostics.)</div>`:""}
      <div style="font-size:11px;color:var(--t3b);margin-bottom:10px;line-height:1.6">Generate a key in Jellyfin → Dashboard → Advanced → API Keys. Stored locally and included in config backups.</div>
      ${(()=>{
        // The monitor keeps its own URL, separate from the Jellyfin tile — which is
        // how Dave ended up pointing it at a Tailscale node that had been offline
        // four days while the tile itself was working fine. If a tile exists, offer
        // its address in one tap instead of making people maintain two copies.
        const tile=S.apps.find(a=>a.id==="jellyfin"&&a.address);
        if(!tile)return"";
        const u=buildUrl(tile);
        if(!u||u===(cfg.url||"").trim().replace(/\/+$/,""))return"";
        return`<button class="host-btn" style="width:100%;margin-bottom:10px;padding:10px"
          onclick="S.jellyfin.url='${esc(u)}';saveJellyfin();S.jfInfo=null;startJellyfinPoll();render();toast('Using your Jellyfin tile address ✓')">
          Use my Jellyfin tile — <span style="font-family:'IBM Plex Mono',ui-monospace,monospace;font-size:11.5px">${esc(u)}</span></button>`;
      })()}
      <button class="btn-save" style="padding:10px" onclick="saveJellyfin();S.jfInfo=null;startJellyfinPoll();toast('Saved ✓ — connecting…')">Save &amp; Connect</button>
    </div>`;

  if(!configured){
    return`<div class="page">
      <div style="display:flex;align-items:center;gap:10px;margin-bottom:14px">
        <span style="font-size:26px">🎬</span>
        <h1 class="pg-title" style="margin-bottom:0">Jellyfin Monitor</h1>
      </div>
      <p style="font-size:14px;color:var(--t2);line-height:1.7;margin-bottom:18px">Live view of active playback — see direct play vs transcode and exactly why Jellyfin is transcoding, in real time.</p>
      ${configCard}
    </div>`;
  }

  // ── Status header with live dot ──
  const header=`
    <div style="display:flex;align-items:center;justify-content:space-between;margin-bottom:14px">
      <div style="display:flex;align-items:center;gap:10px">
        <span style="font-size:24px">🎬</span>
        <div>
          <h1 class="pg-title" style="margin-bottom:2px">Jellyfin Monitor</h1>
          <div style="display:flex;align-items:center;gap:6px">
            <span style="width:8px;height:8px;border-radius:50%;background:${dotColor};display:inline-block${st==="online"?";box-shadow:0 0 6px "+dotColor:""}"></span>
            <span style="font-size:12px;color:${dotColor};font-weight:700">${stLabel}</span>
            ${S.jfInfo?`<span style="font-size:11px;color:var(--t3)">· ${S.jfInfo.ServerName||"Jellyfin"} ${S.jfInfo.Version||""}</span>`:""}
          </div>
        </div>
      </div>
      <div style="display:flex;gap:6px">
        ${(()=>{const ja=S.apps.find(a=>a.id==="jellyfin");const ju=ja?buildUrl(ja):"";return ju?`<button class="ibtn" onclick="openUrlOf('jellyfin')" title="Open Jellyfin" style="width:auto;height:32px;padding:0 10px;font-size:12px;font-weight:700">↗ Open</button>`:"";})()}
        <button class="ibtn" onclick="jellyfinPoll()" title="Refresh now" style="width:32px;height:32px">↻</button>
      </div>
    </div>`;

  // ── Error / blocked banner ──
  const errorBanner=(st==="offline"||st==="blocked")&&S.jfError?`
    <div style="background:${st==="blocked"?"#1a1200":"#1a0808"};border:1px solid ${st==="blocked"?"#4a3800":"#4a1818"};border-radius:12px;padding:12px 14px;margin-bottom:14px">
      <div style="font-size:12px;font-weight:700;color:${st==="blocked"?"#FFC300":"#ff7070"};margin-bottom:4px">${st==="blocked"?"⚠️ Connection blocked":"⚠️ Can't reach Jellyfin"}</div>
      <div style="font-size:12px;color:${st==="blocked"?"#8a7000":"#a05555"};line-height:1.6">${S.jfError}</div>
      ${st==="blocked"?`<button onclick="go('tailscale')" style="margin-top:8px;background:var(--warn-bg);border:1px solid var(--warn-line);border-radius:8px;padding:6px 12px;color:var(--warn);font-size:12px;font-weight:700;cursor:pointer;font-family:inherit">Set up Tailscale HTTPS →</button>`:""}
    </div>`:"";

  // ── Now Playing cards ──
  const sessions=S.jfSessions||[];
  const cards=sessions.map(s=>{
    const item=s.NowPlayingItem||{};
    const ps=s.PlayState||{};
    const method=ps.PlayMethod||"Unknown";
    const isTranscode=method==="Transcode";
    const isDirectStream=method==="DirectStream";
    const badgeColor=isTranscode?"#FFC300":isDirectStream?"#4b9fff":"#00e87a";
    const badgeBg=isTranscode?"#2a2000":isDirectStream?"#0a1a2e":"#0a2010";
    const badgeText=isTranscode?"Transcode":isDirectStream?"Direct Stream":"Direct Play";

    // Title: "Series SxxEyy · Episode" or movie name
    let title=item.Name||"Unknown";
    let subtitle="";
    if(item.SeriesName){
      const s_=item.SeasonName?item.SeasonName.replace(/season\s*/i,"S"):"";
      const ep=item.IndexNumber?`E${String(item.IndexNumber).padStart(2,"0")}`:"";
      subtitle=`${item.SeriesName}${s_||ep?" · "+s_+ep:""}`;
    }

    // Progress
    const posSec=ticksToSec(ps.PositionTicks);
    const runSec=ticksToSec(item.RunTimeTicks);
    const pct=runSec>0?Math.min(100,Math.round(posSec/runSec*100)):0;

    // Transcode detail
    const ti=s.TranscodingInfo;
    let transcodeDetail="";
    if(isTranscode&&ti){
      const reasons=(ti.TranscodeReasons||[]).map(r=>`<div style="font-size:12px;color:var(--warn2);line-height:1.5;padding:3px 0;display:flex;gap:7px"><span style="color:var(--warn);flex-shrink:0">•</span><span><strong style="color:var(--warn-text)">${r}</strong> — ${reasonPlain(r)}</span></div>`).join("");
      const vDirect=ti.IsVideoDirect,aDirect=ti.IsAudioDirect;
      transcodeDetail=`
        <div style="margin-top:10px;background:var(--warn-bg);border:1px solid var(--warn-line);border-radius:10px;padding:10px 12px">
          <div style="font-size:11px;font-weight:700;color:var(--warn);text-transform:uppercase;letter-spacing:.8px;margin-bottom:6px">Why it's transcoding</div>
          ${reasons||'<div style="font-size:12px;color:var(--warn2)">No specific reason reported</div>'}
          <div style="display:flex;flex-wrap:wrap;gap:6px;margin-top:10px">
            ${ti.Bitrate?`<span style="font-size:11px;background:var(--ground);border:1px solid var(--line);border-radius:6px;padding:3px 8px;color:var(--warn2)">${(ti.Bitrate/1000000).toFixed(1)} Mbps</span>`:""}
            ${ti.VideoCodec?`<span style="font-size:11px;background:var(--ground);border:1px solid var(--line);border-radius:6px;padding:3px 8px;color:${vDirect?"#00e87a":"#c0a060"}">video: ${ti.VideoCodec}${vDirect?" (direct)":""}</span>`:""}
            ${ti.AudioCodec?`<span style="font-size:11px;background:var(--ground);border:1px solid var(--line);border-radius:6px;padding:3px 8px;color:${aDirect?"#00e87a":"#c0a060"}">audio: ${ti.AudioCodec}${aDirect?" (direct)":""}</span>`:""}
            ${ti.Container?`<span style="font-size:11px;background:var(--ground);border:1px solid var(--line);border-radius:6px;padding:3px 8px;color:var(--warn2)">→ ${ti.Container}</span>`:""}
            ${ti.CompletionPercentage!=null?`<span style="font-size:11px;background:var(--ground);border:1px solid var(--line);border-radius:6px;padding:3px 8px;color:var(--accent-text)">${Math.round(ti.CompletionPercentage)}% transcoded</span>`:""}
          </div>
        </div>`;
    }

    return`
    <div style="background:var(--surface);border:1px solid var(--line);border-top:3px solid ${badgeColor};border-radius:14px;padding:14px;margin-bottom:12px">
      <div style="display:flex;align-items:flex-start;justify-content:space-between;gap:10px;margin-bottom:8px">
        <div style="flex:1;min-width:0">
          <div style="font-size:15px;font-weight:800;color:var(--ink);line-height:1.3;word-break:break-word">${esc(title)}</div>
          ${subtitle?`<div style="font-size:12px;color:var(--t2);margin-top:2px">${esc(subtitle)}</div>`:""}
        </div>
        <span style="flex-shrink:0;background:${badgeBg};border:1px solid ${badgeColor}55;color:${badgeColor};font-size:11px;font-weight:800;padding:4px 10px;border-radius:20px">${badgeText}</span>
      </div>
      <div style="font-size:11px;color:var(--t3b);margin-bottom:10px">
        ${esc(s.UserName||"?")} · ${esc(s.DeviceName||s.Client||"?")}${s.Client?" · "+esc(s.Client):""}${ps.IsPaused?' · <span style="color:var(--warn)">Paused</span>':""}
      </div>
      <div style="height:6px;background:var(--surface);border-radius:3px;overflow:hidden;margin-bottom:4px">
        <div style="height:100%;width:${pct}%;background:${badgeColor};border-radius:3px;transition:width .5s"></div>
      </div>
      <div style="display:flex;justify-content:space-between;font-size:11px;color:var(--t3b);font-family:'IBM Plex Mono',ui-monospace,monospace">
        <span>${fmtTime(posSec)}</span>
        <span>${item.Container?item.Container.toUpperCase():""}</span>
        <span>${fmtTime(runSec)}</span>
      </div>
      ${transcodeDetail}
    </div>`;
  }).join("");

  // ── Empty state ──
  const nowPlaying=st==="online"?(sessions.length?cards:`
    <div style="text-align:center;padding:36px 20px;color:var(--t3)">
      <div style="font-size:40px;margin-bottom:10px;opacity:.5">⏸️</div>
      <div style="font-size:14px;font-weight:700;color:var(--t2)">Nothing playing right now</div>
      <div style="font-size:12px;color:var(--t3);margin-top:4px">Start an episode and it'll appear here live</div>
    </div>`):"";

  // ── Logs section ──
  const logsSection=st==="online"?`
    <div style="margin-top:18px">
      <div style="display:flex;align-items:center;justify-content:space-between;margin-bottom:8px">
        <div class="lbl" style="margin-bottom:0">📋 Server Logs</div>
        <button onclick="loadJellyfinLogs()" style="background:none;border:none;font-size:11px;color:var(--accent-text);cursor:pointer;font-weight:700;font-family:inherit">${S.jfLogs.length?"Refresh":"Load logs"} ›</button>
      </div>
      ${S.jfLogs.length?`<div style="background:var(--surface);border:1px solid var(--line);border-radius:12px;overflow:hidden">
        ${S.jfLogs.slice(0,8).map(l=>`<div style="display:flex;align-items:center;justify-content:space-between;padding:9px 12px;border-bottom:1px solid var(--line);cursor:pointer" onclick="openJellyfinLog('${(l.Name||"").replace(/'/g,"\\'")}')">
          <div style="min-width:0;flex:1"><div style="font-size:12px;color:${/ffmpeg|transcode/i.test(l.Name||"")?"#FFC300":"#b0b8e0"};font-family:var(--f-mono);overflow:hidden;text-overflow:ellipsis;white-space:nowrap">${l.Name||"?"}</div></div>
          <span style="font-size:11px;color:var(--t3);flex-shrink:0;margin-left:8px">${l.Size?Math.round(l.Size/1024)+"KB":""}</span>
        </div>`).join("")}
      </div>
      <div style="font-size:11px;color:var(--t3);margin-top:6px">ffmpeg/transcode logs are highlighted — open the newest to diagnose stops.</div>`:`<div style="font-size:12px;color:var(--t3);padding:4px 2px">Tap "Load logs" to list recent server logs.</div>`}
    </div>`:"";

  return`<div class="page">
    ${header}
    ${errorBanner}
    ${st==="online"?`<div class="lbl" style="margin-bottom:10px">▶️ Now Playing${sessions.length?" ("+sessions.length+")":""}</div>`:""}
    ${nowPlaying}
    ${logsSection}
    ${st==="online"?`
    <div style="margin-top:18px">
      <div class="lbl" style="margin-bottom:8px">🤖 AI Diagnosis</div>
      <div style="display:flex;gap:8px;margin-bottom:10px">
        <button onclick="analyzeWithClaude()" ${S.aiBusy?"disabled":""} style="flex:1;padding:11px 14px;background:${S.aiBusy?"#141425":"linear-gradient(135deg,#3a2a00,#5a4200)"};border:1px solid #7a5a10;border-radius:10px;color:#ffce55;font-size:13px;font-weight:700;cursor:pointer;font-family:inherit">${S.aiBusy?"Analyzing…":"✨ Analyze with Claude"}</button>
        <button onclick="copyJfDiagnostics()" style="flex:1;padding:11px 14px;background:var(--surface);border:1px solid var(--line);border-radius:10px;color:var(--accent-text);font-size:13px;font-weight:700;cursor:pointer;font-family:inherit">📋 Copy diagnostics</button>
      </div>
      ${S.aiResult?`<div style="background:var(--surface);border:1px solid var(--warn-line);border-left:3px solid var(--warn-line);border-radius:12px;padding:14px;font-size:13px;color:var(--ink);line-height:1.7;white-space:pre-wrap;word-break:break-word;margin-bottom:10px">${S.aiResult.replace(/[&<>]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;"}[c]))}</div>`:""}
      <input class="inp" id="ai-key-inp" type="password" placeholder="Anthropic API key (console.anthropic.com) — for one-tap analysis" value="${S.aiKey}" style="margin-bottom:6px" autocomplete="off">
      <div style="display:flex;gap:8px;align-items:center;margin-bottom:4px">

function matchImage(img){img=String(img||"").toLowerCase();for(const [pat,id] of IMAGE_MAP){if(new RegExp(pat).test(img))return CATALOG.find(c=>c.id===id)||null;}return null;}
function savePortainer(){localStorage.setItem(PORTAINER_KEY,JSON.stringify({url:S.pt.url,token:S.pt.token}));}
async function portainerScan(){
  const p=parseAddress(S.pt.url,"9000");
  if(!S.pt.url.trim()||p.error){toast("Enter Portainer's address, e.g. 192.168.1.20:9000","#FFC300");return;}
  const base=p.full?p.address:`${p.protocol||"http"}://${p.address}:${p.port||"9000"}`;
  if(!S.pt.token.trim()){toast("Paste an access token (Portainer → My account → Access tokens)","#FFC300");return;}
  savePortainer();
  const h={"X-API-Key":S.pt.token.trim()};
  S.pt.busy=true;S.pt.error="";S.pt.items=null;render();
  try{
    const eps=await jget(`${base}/api/endpoints`,h);
    if(!Array.isArray(eps)||!eps.length)throw new Error("Portainer has no environments to read");
    const ep=eps[0];
    const cs=await jget(`${base}/api/endpoints/${ep.Id}/docker/containers/json?all=1`,h);
    const host=extractIp(base);
    S.pt.items=(Array.isArray(cs)?cs:[]).map(c=>{
      const name=String((c.Names&&c.Names[0])||"").replace(/^\//,"").replace(/[<>]/g,"").slice(0,40);
      const pairs=(c.Ports||[]).filter(x=>x.PublicPort&&(x.Type||"tcp")==="tcp");
      const ports=[...new Set(pairs.map(x=>+x.PublicPort))].sort((a,b)=>a-b);
      const cat=matchImage(c.Image);
      const NOT_WEB=[22,25,53,110,143,443,465,587,993,995,3306,5432,6379,27017];
      const byPrivate=cat?pairs.find(x=>+x.PrivatePort===+cat.port):null;
      const webish=ports.filter(p=>!NOT_WEB.includes(p));
      const port=byPrivate?String(byPrivate.PublicPort):(cat&&ports.includes(+cat.port)?String(cat.port):(webish[0]?String(webish[0]):(ports[0]?String(ports[0]):"")));
      return{name,image:String(c.Image||"").replace(/[<>]/g,"").slice(0,80),state:String(c.State||""),port,ports,cat,host,on:!!port};
    }).sort((a,b)=>(b.on-a.on)||a.name.localeCompare(b.name));
    S.pt.endpoint=String(ep.Name||"").replace(/[<>]/g,"");
  }catch(e){
    S.pt.error=e.name==="AbortError"?"Portainer didn't answer in 8 seconds. Check the address.":e.message==="Failed to fetch"?(location.protocol==="https:"?"This page is HTTPS, so the browser won't read an http:// Portainer from here. Open NAS Hub from your NAS's own address (the Docker install) and try again.":"Couldn't reach Portainer. Check the address and that Portainer is running."):e.message==="key refused"?"Portainer refused that token. Make a new one under My account → Access tokens.":e.message;
  }
  S.pt.busy=false;render();
}
function portainerToggle(i){if(S.pt.items&&S.pt.items[i]){S.pt.items[i].on=!S.pt.items[i].on;render();}}
function portainerAdd(){
  if(!S.pt.items)return;
  let added=0,updated=0;
  S.pt.items.filter(i=>i.on&&i.port).forEach(i=>{
    const base=i.cat||{id:("custom-"+i.name.replace(/[^a-z0-9]/gi,"").toLowerCase().slice(0,30)||"custom-"+Date.now()),name:i.name||"Container",emoji:"🐳",color:"#13BEF9",cat:"Custom",desc:"Docker container"};
    const ex=S.apps.find(a=>a.id===base.id);
    if(ex){S.apps=S.apps.map(a=>a.id===base.id?{...a,address:i.host,port:i.port}:a);updated++;}
    else{const rec=cleanApp({...base,address:i.host,port:i.port,protocol:"http",favorite:false,notes:"",groupId:null,username:"",password:""});if(rec){S.apps.push(rec);added++;}}

  save();toast(`Portainer: ${added} added, ${updated} updated ✓`);S.onboarded=true;localStorage.setItem(ONBOARD_KEY,"1");go("home");
}

      </div>

      ${knownIps.length?`<div style="background:var(--surface);border:1px solid var(--line);border-radius:10px;padding:10px 14px;font-size:12px;color:var(--t2);line-height:1.8;margin-bottom:12px">

        </div>

// ── TrueNAS ─────────────────────────────────────────────────────────────────
// Measured against a real TrueNAS 25.04 box on 2026-09-16 before a line of this
// was written, because the obvious approach does not work:
//
//   REST /api/v2.0  — sends NO CORS headers, and answers an OPTIONS preflight
//                     with 405. Every authenticated call carries an
//                     Authorization header, which forces that preflight. Dead.
//   WS /api/current — handshake returns 101 and accepts our Origin. Websockets
//                     skip preflight, and auth happens INSIDE the protocol
//                     (auth.login_with_api_key), so nothing triggers CORS.
//
// Confirmed shapes from that probe: a bad key returns {result:false} rather than
// throwing, and calling anything before logging in returns error -32001 with
// errname ENOTAUTHENTICATED. Both are handled below as normal outcomes.
function saveTruenas(){localStorage.setItem(TRUENAS_KEY,JSON.stringify(S.truenas));}

// The page's own scheme decides ours: an https page may only open wss.
function tnWsUrl(host){
  const h=normalizeHost(host);
  if(!h)return"";
  return (location.protocol==="https:"?"wss://":"ws://")+h+"/api/current";
}
// An https page talking to a NAS with the stock self-signed iXsystems cert will
// fail the TLS handshake with no usable error — the browser just closes it. Say
// so up front instead of letting it look like a bug in the app.
function tnInsecureWarning(){
  if(location.protocol!=="https:")return"";
  const h=normalizeHost(S.truenas.host);
  if(!h)return"";
  if(/\.ts\.net$/i.test(h))return"";              // Tailscale gives a real cert
  return`NAS Hub is served over https, so it can only open a secure (wss) connection. TrueNAS ships a self-signed certificate that browsers refuse, and unlike a page warning there is no way to click through it. Two ways round: run <strong>tailscale serve --https=443</strong> on the NAS and use the <strong>…ts.net</strong> hostname here, or run NAS Hub from the NAS itself, where this restriction does not apply.`;
}

// One connection, log in, run every call, close. Opening a socket per call would
// mean re-authenticating each time.
function tnRun(calls,timeoutMs=12000){
  return new Promise((resolve,reject)=>{
    const url=tnWsUrl(S.truenas.host);
    if(!url)return reject(new Error("Set your TrueNAS hostname first"));
    if(!S.truenas.apiKey)return reject(new Error("Set your TrueNAS API key first"));
    let ws,done=false;
    const finish=(err,val)=>{
      if(done)return;done=true;
      try{ws&&ws.close();}catch(e){}
      err?reject(err):resolve(val);
    };
    const timer=setTimeout(()=>finish(new Error("TrueNAS did not answer in time. Check the hostname and that you are on the same network or Tailscale.")),timeoutMs);
    try{ws=new WebSocket(url);}
    catch(e){clearTimeout(timer);return finish(new Error("Could not open a connection to "+normalizeHost(S.truenas.host)));}

    let id=0;const pending={};const out={};
    const send=(method,params=[])=>{const myId=++id;pending[myId]=method;ws.send(JSON.stringify({jsonrpc:"2.0",id:myId,method,params}));return myId;};

    ws.onerror=()=>{clearTimeout(timer);finish(new Error(location.protocol==="https:"
      ? "The secure connection was refused — this is almost always the TrueNAS certificate. See the note above."
      : "Could not reach TrueNAS at "+normalizeHost(S.truenas.host)));};
    ws.onclose=()=>{if(!done){clearTimeout(timer);finish(new Error("TrueNAS closed the connection before answering."));}};
    ws.onopen=()=>{send("auth.login_with_api_key",[S.truenas.apiKey]);};
    ws.onmessage=ev=>{
      let m;try{m=JSON.parse(ev.data);}catch(e){return;}
      const method=pending[m.id];delete pending[m.id];
      if(m.error){
        const d=m.error.data||{};
        clearTimeout(timer);
        return finish(new Error(d.errname==="ENOTAUTHENTICATED"
          ? "TrueNAS rejected the API key."
          : (d.reason||m.error.message||"TrueNAS returned an error")));
      }
      if(method==="auth.login_with_api_key"){
        // A wrong key comes back as a plain false, not an error.
        if(m.result!==true){clearTimeout(timer);return finish(new Error("TrueNAS rejected the API key. Make a new one in TrueNAS under the top-right account icon → My API Keys, and paste it straight in — it is only shown once."));}
        calls.forEach(c=>send(c.method,c.params||[]));
        return;
      }
      const call=calls.find(c=>c.method===method);
      if(call)out[call.as||call.method]=m.result;
      if(Object.keys(out).length===calls.length){clearTimeout(timer);finish(null,out);}
    };
  });
}

// ── Down alerts ─────────────────────────────────────────────────────────────
// Dave cut this feature on 2026-09-13 — "I'd get multiple alerts a day, I don't
// trust the down/not-down" — and he was right twice over: the HTTP probe was
// guessing, and nothing was stopping it from telling him about every guess. The
// bridge fixed the first half. The worker's decision engine fixes the second,
// and that is where all the restraint lives; this file only turns it on.
//
// The notification itself comes from the worker while the app is closed, so
// everything here is setup: permission, a push subscription, and the two
// preferences worth having.

function pushSupported(){
  return "serviceWorker" in navigator && "PushManager" in window && "Notification" in window;
}
// iOS only allows this for a PWA that has been added to the home screen, and it
// fails in a way that looks like a bug if you do not say so first.
function iosNeedsInstall(){
  const iOS=/iPad|iPhone|iPod/.test(navigator.userAgent)||
    (navigator.platform==="MacIntel"&&navigator.maxTouchPoints>1);
  return iOS && !window.matchMedia("(display-mode: standalone)").matches && !navigator.standalone;
}
function alertsAuth(){
  const sg=S.syncGroup;
  if(!sg)return null;
  const tok=sg.adminToken||sg.memberToken;
  if(!tok)return null;
  const h={Authorization:`Bearer ${tok}`,"X-Device-Id":getDeviceId(),"X-Device-Name":getDeviceName()};
  return h;
}
async function loadAlerts(quiet){
  const h=alertsAuth();
  if(!h){S.alerts=null;if(!quiet)render();return;}
  try{
    const r=await fetch(`${API_BASE}/sync/${S.syncGroup.code}/alerts`,{headers:h});
    S.alerts=r.ok?await r.json():null;
  }catch(e){S.alerts=null;}
  if(!quiet)render();
}
async function enableAlerts(){
  if(S.alertsBusy)return;
  if(!pushSupported()){toast("This browser can't do notifications","#FFC300");return;}
  if(iosNeedsInstall()){
    toast("On iPhone, add NAS Hub to your Home Screen first — Safari can't send notifications from a tab","#FFC300");
    return;
  }
  const h=alertsAuth();
  if(!h){toast("Join a sync group first","#FFC300");return;}
  S.alertsBusy=true;render();
  try{
    const perm=await Notification.requestPermission();
    if(perm!=="granted"){
      toast(perm==="denied"
        ?"Notifications are blocked for this site — you'll have to allow them in your browser settings"
        :"Notifications weren't allowed","#FFC300");
      return;
    }
    const info=S.alerts||await (await fetch(`${API_BASE}/sync/${S.syncGroup.code}/alerts`,{headers:h})).json();
    if(!info.vapidPublicKey){toast("Alerts aren't switched on for this server yet","#FFC300");return;}
    const reg=await navigator.serviceWorker.ready;
    // Re-use an existing subscription if the key still matches; a stale one from
    // an older key has to go or every push silently fails.
    let subn=await reg.pushManager.getSubscription();
    if(subn){
      const cur=bytesToB64url(new Uint8Array(subn.options.applicationServerKey||new ArrayBuffer(0)));
      if(cur!==info.vapidPublicKey){await subn.unsubscribe();subn=null;}
    }
    if(!subn){
      try{
        subn=await reg.pushManager.subscribe({
          userVisibleOnly:true,
          applicationServerKey:b64urlToBytes(info.vapidPublicKey)
        });
      }catch(e){
        // Chrome disables the Push API entirely in incognito and says so with the
        // same "permission denied" as a real refusal, which sends people to check
        // settings that are already correct.
        throw new Error(/denied|not allowed/i.test(e.message||"")
          ? "This browser won't allow push here — private/incognito windows can't receive notifications. Open NAS Hub in a normal window."
          : (e.message||"Could not subscribe to notifications"));
      }
    }
    const j=subn.toJSON();
    const r=await fetch(`${API_BASE}/sync/${S.syncGroup.code}/alerts/subscribe`,{
      method:"POST",headers:{...h,"Content-Type":"application/json"},
      body:JSON.stringify({subscription:{endpoint:j.endpoint,keys:j.keys},
        prefs:{...(S.alerts&&S.alerts.prefs||{}),tzOffsetMin:new Date().getTimezoneOffset()}})
    });
    if(!r.ok){
      const e=await r.json().catch(()=>({}));
      toast(e.error||"Could not switch alerts on",r.status===402?"#FFC300":"#ff5555");
      return;
    }
    await loadAlerts(true);
    toast("Alerts on — send yourself a test ✓","#4aff6a");
  }catch(e){
    toast(e.message||"Could not switch alerts on","#ff5555");
  }finally{S.alertsBusy=false;render();}
}
async function disableAlerts(){
  const h=alertsAuth();if(!h)return;
  S.alertsBusy=true;render();
  try{
    const reg=await navigator.serviceWorker.ready;
    const subn=await reg.pushManager.getSubscription();
    if(subn)await subn.unsubscribe();
    await fetch(`${API_BASE}/sync/${S.syncGroup.code}/alerts/subscribe`,{method:"DELETE",headers:h});
    await loadAlerts(true);
    toast("Alerts off","#8899cc");

  finally{S.alertsBusy=false;render();}
}

}

const hm=v=>{const m=/^(\d{1,2}):(\d{2})$/.exec(String(v||""));return m?(+m[1])*60+(+m[2]):0;};
// "4 min ago" for an ISO timestamp — tnAgeText() reads the bridge record, this
// reads a bare date, which is what the alerts endpoint returns.
function tnAgo(iso){
  const a=Math.max(0,Math.round((Date.now()-Date.parse(iso))/1000));
  return a<90?`${a}s ago`:a<5400?`${Math.round(a/60)} min ago`:`${Math.round(a/3600)}h ago`;
}
function toggleQuietHours(){
  const q=S.alerts&&S.alerts.prefs&&S.alerts.prefs.quiet;
  saveAlertPrefs({quiet:q?null:{from:23*60,to:7*60}});
}
// base64url <-> bytes, for the VAPID key the browser wants as a Uint8Array.
function b64urlToBytes(s){
  const b64=String(s).replace(/-/g,"+").replace(/_/g,"/");
  const bin=atob(b64+"=".repeat((4-b64.length%4)%4));
  const out=new Uint8Array(bin.length);
  for(let i=0;i<bin.length;i++)out[i]=bin.charCodeAt(i);
  return out;
}
function bytesToB64url(b){
  let s="";const a=new Uint8Array(b);
  for(let i=0;i<a.length;i++)s+=String.fromCharCode(a[i]);
  return btoa(s).replace(/\+/g,"-").replace(/\//g,"_").replace(/=+$/,"");
}

// ── The bridge: read what the NAS pushed, instead of reaching into the NAS ───
// Direct browser→TrueNAS is a dead end from the hosted app (no CORS on REST, a
// 405 preflight, and a self-signed cert that kills wss). Every one of those walls
// is there because the PHONE was the one reaching. So the NAS pushes to the
// worker on a timer and the phone reads it from the same origin as the app.
// tnConnect() below still exists for the self-hosted build, where plain ws://
// to the NAS works with none of these restrictions.
async function tnLoadBridge(quiet){
  if(!S.syncGroup?.code){S.tnBridge=null;return;}
  try{
    const r=await fetch(`${API_BASE}/sync/${S.syncGroup.code}/nas`);
    if(!r.ok)throw new Error();
    S.tnBridge=await r.json();
    if(S.tnBridge.present){
      // Feed the same state the websocket path fills, so port extraction,
      // catalogue matching and import are shared rather than written twice.
      S.tnInfo=S.tnBridge.info||null;
      S.tnApps=Array.isArray(S.tnBridge.apps)?S.tnBridge.apps:[];
      S.tnPools=Array.isArray(S.tnBridge.pools)?S.tnBridge.pools:[];
      S.tnStatus=S.tnBridge.stale?"stale":"online";
    }
  }catch(e){S.tnBridge=null;}
  if(!quiet)render();
}
// Minting rotates the token on the worker, so a NAS already reporting with the
// old one goes silent. That is fine when you are setting up and a disaster when
// you tap it by accident, which is why the button disappears once a token is on
// screen and coming back costs a confirmation.
async function tnNewToken(){
  if(!await askSheet("Make a new agent token?\n\nThe current one stops working straight away. If your NAS is already reporting, it will go quiet until you re-run the install line with the new token."))return;
  S.tnAgent=null;tnMakeAgentToken();
}
async function tnMakeAgentToken(){
  const sg=S.syncGroup;
  if(!sg?.adminToken){toast("Only the group owner can set this up","#FFC300");return;}
  try{
    const r=await fetch(`${API_BASE}/sync/${sg.code}/nas-token`,{method:"POST",headers:{Authorization:`Bearer ${sg.adminToken}`}});
    if(!r.ok)throw new Error("Could not create the token");
    S.tnAgent=(await r.json()).agentToken;
    render();
  }catch(e){toast(e.message||"Could not create the token","#ff5555");}
}
function tnAgeText(){
  const b=S.tnBridge;
  if(!b||!b.present)return"";
  const a=b.ageSeconds;
  const t=a<90?`${a}s ago`:a<5400?`${Math.round(a/60)} min ago`:`${Math.round(a/3600)}h ago`;
  return b.stale?`last heard ${t} — the NAS has stopped reporting`:`as of ${t}`;
}
// The agent script, which is what people should actually use. The raw one-liner
// below still works and is kept as the escape hatch, but it has no error
// handling: if midclt is missing, or the payload is over the worker's cap, or
// the network is down, it prints nothing and the phone just keeps saying
// "nothing has arrived yet" with no way to find out why. The script says what
// happened, retries what deserves retrying, falls back to the REST API when
// midclt is absent, and has a `check` mode that diagnoses the whole chain.
// Self-hosted copies serve the agent from the NAS itself, which also means the
// download works on a NAS with no route to the internet. Anything not served
// over http(s) — a file:// copy, mostly — falls back to the public build.
const AGENT_URL=/^https?:$/.test(location.protocol)
  ? location.origin+"/agent/nashub-agent.py"
  : "https://app.nashubapp.com/agent/nashub-agent.py";
function tnAgentLines(){
  const code=S.syncGroup?.code||"YOUR-CODE";
  const tok=S.tnAgent||"YOUR-AGENT-TOKEN";
  return`curl -fsSL ${AGENT_URL} -o /root/nashub-agent.py
python3 /root/nashub-agent.py install ${code} ${tok} ${hasServer()?API_BASE:"YOUR-SYNC-SERVER"}
python3 /root/nashub-agent.py check`;
}
// The line the user pastes into a TrueNAS cron job. midclt is the local
// middleware client: it runs as root on the NAS and needs no API key at all.
function tnCronLine(){
  const code=S.syncGroup?.code||"YOUR-CODE";
  const tok=S.tnAgent||"YOUR-AGENT-TOKEN";
  return`{ echo -n '{"agent":"cron","info":'; midclt call system.info; echo -n ',"apps":'; midclt call app.query; echo -n ',"pools":'; midclt call pool.query; echo '}'; } | curl -s -X POST ${API_BASE}/sync/${code}/nas -H "Authorization: Bearer ${tok}" -H "Content-Type: application/json" --data-binary @-`;
}

async function tnConnect(){
  S.tnStatus="connecting";S.tnError="";render();
  try{
    const r=await tnRun([
      {method:"system.info",as:"info"},
      {method:"app.query",as:"apps"},
      {method:"pool.query",as:"pools"},
    ]);
    S.tnInfo=r.info||null;
    S.tnApps=Array.isArray(r.apps)?r.apps:[];
    S.tnPools=Array.isArray(r.pools)?r.pools:[];
    S.tnStatus="online";S.tnError="";
    toast(`TrueNAS connected — ${S.tnApps.length} app${S.tnApps.length===1?"":"s"} found ✓`,"#4aff6a");
  }catch(e){
    S.tnStatus="error";S.tnError=e.message||"Could not connect";
    S.tnInfo=null;S.tnApps=[];S.tnPools=[];
  }
  render();
}

// TrueNAS reports a portal like {"Web UI":"http://0.0.0.0:30027"}. The 0.0.0.0 is
// "every interface on the NAS", which is useless as an address on a phone — the
// port is the part worth keeping, paired with the host the user already gave us.
function tnPort(a){
  const portals=a&&a.portals||{};
  for(const k of Object.keys(portals)){
    const m=String(portals[k]||"").match(/:(\d{2,5})(?:\/|$)/);
    if(m)return m[1];
  }
  const used=a&&a.active_workloads&&a.active_workloads.used_ports;
  if(Array.isArray(used)){
    for(const p of used){
      const n=p&&(p.port_number??p.host_port);
      if(n)return String(n);
    }
  }
  return"";
}
function tnState(a){return String(a&&a.state||"").toUpperCase();}
const tnKey=x=>String(x||"").toLowerCase().replace(/[^a-z0-9]/g,"");
// Which of the user's tiles does the bridge report have something to say about?
// Name is the primary match — an imported tile keeps the app's own name — with a
// port match as the fallback, and ONLY when we know the NAS's address: AdGuard,
// Gitea and Grafana all sit on :3000, so a bare port match across machines would
// happily tell you Grafana is stopped because Gitea is.
// Is the NAS's last report recent enough to act on? A stale report is worse
// than none: it looks current and describes a NAS that stopped talking.
function tnFresh(){const b=S.tnBridge;return !!(b&&b.present&&!b.stale);}
const tnBytes=n=>{
  n=Number(n);if(!isFinite(n)||n<=0)return"";
  const u=["B","KB","MB","GB","TB","PB"];let i=0;
  while(n>=1024&&i<u.length-1){n/=1024;i++;}
  return(n>=10||i<2?Math.round(n):n.toFixed(1))+" "+u[i];
};
// A pool that has gone DEGRADED is the single most important thing a NAS can
// tell you, and until now it was three taps away on the TrueNAS screen. A pool
// filling up is the second — ZFS gets slow and unhappy well before 100%, and
// it is the one failure you can still do something about.
function tnPoolAlerts(){
  if(!tnFresh()||!Array.isArray(S.tnPools))return[];
  const out=[];
  for(const p of S.tnPools){
    const name=String(p&&p.name||"pool"),st=String(p&&p.status||"").toUpperCase();
    if(st&&st!=="ONLINE"){
      out.push({bad:1,title:`Pool ${name} is ${st}`,
        body:st==="DEGRADED"
          ?"A disk in this pool has failed or dropped out. Your data is still readable and still being written, but there is no redundancy left to lose — replace the drive before a second one goes."
          :"This pool is not healthy. Open TrueNAS → Storage and look at the pool status before writing anything else to it."});
      continue;               // a degraded pool's free space is not the story
    }
    const free=Number(p&&p.free),size=Number(p&&p.size);
    if(isFinite(free)&&isFinite(size)&&size>0){
      const pct=Math.round((1-free/size)*100);
      if(pct>=85)out.push({bad:pct>=95,title:`Pool ${name} is ${pct}% full`,
        body:`${tnBytes(free)} left of ${tnBytes(size)}. ZFS slows down badly as a pool fills, and snapshots stop being able to free space — clear some room or add a disk.`});
    }
  }
  return out;
}
function tnBridgeMap(){
  const b=S.tnBridge;
  if(!tnFresh()||!Array.isArray(b.apps)||!b.apps.length)return null;
  const host=normalizeHost(S.truenas&&S.truenas.host||"");
  const m={};
  for(const a of b.apps){
    const st=tnState(a);if(!st)continue;
    const nk=tnKey(a.name),ik=tnKey(a.id||a.name),port=tnPort(a);
    for(const x of S.apps){
      if(m[x.id])continue;
      if(tnKey(x.name)===nk||tnKey(x.id)===ik||
         (host&&port&&String(x.port)===port&&normalizeHost(x.address)===host))m[x.id]=st;
    }
  }
  return Object.keys(m).length?m:null;
}
// Match a discovered app against the built-in catalog so it arrives with a real
// icon and colour instead of a generic globe.
function tnCatalogMatch(name){
  const n=String(name||"").toLowerCase().replace(/[^a-z0-9]/g,"");
  if(!n||typeof CATALOG==="undefined"||!Array.isArray(CATALOG))return null;
  return CATALOG.find(c=>{
    const cn=String(c.name||"").toLowerCase().replace(/[^a-z0-9]/g,"");
    const ci=String(c.id||"").toLowerCase().replace(/[^a-z0-9]/g,"");
    return cn===n||ci===n||(n.length>3&&(cn.includes(n)||n.includes(ci)));
  })||null;
}
function tnAlreadyHave(a){
  const port=tnPort(a);
  const nm=String(a.name||"").toLowerCase();
  const host=normalizeHost(S.truenas.host);
  // Same port on a DIFFERENT machine is a different app (AdGuard, Gitea and
  // Grafana all default to :3000). Only a port match on this NAS counts.
  return S.apps.some(x=>String(x.name||"").toLowerCase()===nm||
    (port&&String(x.port)===port&&normalizeHost(x.address)===host));
}
function tnImportPicked(){
  const host=normalizeHost(S.truenas.host);
  const picked=S.tnApps.filter(a=>S.tnPicked[a.id||a.name]);
  if(!picked.length){toast("Tick the apps you want first","#FFC300");return;}
  let added=0;
  picked.forEach(a=>{
    const port=tnPort(a);
    if(!port)return;                       // no port, no working tile — skip it
    const c=tnCatalogMatch(a.name);
    const id=String(a.id||a.name).toLowerCase().replace(/[^a-z0-9_-]/g,"").slice(0,60)||("app"+Date.now());
    if(S.apps.some(x=>x.id===id))return;
    S.apps.push(cleanApp({
      id,name:c?c.name:String(a.name||id),
      emoji:c?c.emoji:"🗄️",color:c?c.color:"#4fd1c5",
      port,cat:c?c.cat:"TrueNAS",desc:c?c.desc:"Discovered on TrueNAS",
      address:host,protocol:"http"
    }));
    added++;
  });
  if(!added){toast("Nothing new to add","#FFC300");return;}
  save();S.tnPicked={};
  toast(`Added ${added} app${added===1?"":"s"} ✓`,"#4aff6a");
  render();
}

// Ticks are 100-ns units → seconds
function ticksToSec(t){return t?Math.floor(t/10000000):0;}
function fmtTime(sec){
  if(!sec&&sec!==0)return"—";
  const h=Math.floor(sec/3600),m=Math.floor((sec%3600)/60),s=sec%60;
  return(h>0?h+":":"")+String(m).padStart(h>0?2:1,"0")+":"+String(s).padStart(2,"0");
}
// Plain-language translations for Jellyfin TranscodeReasons
const TRANSCODE_REASONS={
  ContainerNotSupported:"The file container isn't supported by this player",
  ContainerBitrateExceedsLimit:"Bitrate is higher than the client/network allows",
  VideoCodecNotSupported:"The player can't decode this video codec",
  AudioCodecNotSupported:"The player can't decode this audio codec",
  SubtitleCodecNotSupported:"The subtitle format must be burned in",
  AudioIsExternal:"Audio track is external and must be merged",
  VideoProfileNotSupported:"Video profile (e.g. 10-bit/HEVC) not supported by player",
  VideoLevelNotSupported:"Video level exceeds player capability",
  VideoResolutionNotSupported:"Resolution higher than the player supports",
  VideoBitDepthNotSupported:"Bit depth (e.g. 10-bit HDR) not supported",
  VideoFramerateNotSupported:"Frame rate not supported by player",
  RefFramesNotSupported:"Too many reference frames for the player",
  AnamorphicVideoNotSupported:"Anamorphic video not supported",
  InterlacedVideoNotSupported:"Interlaced video must be deinterlaced",
  AudioChannelsNotSupported:"Audio channel layout (e.g. 5.1/7.1) not supported",
  AudioProfileNotSupported:"Audio profile not supported by player",
  AudioSampleRateNotSupported:"Audio sample rate not supported",
  SecondaryAudioNotSupported:"Secondary audio track not supported",
  AudioBitrateNotSupported:"Audio bitrate exceeds the limit",
  UnknownVideoStreamInfo:"Video stream info couldn't be read",
  UnknownAudioStreamInfo:"Audio stream info couldn't be read",
  DirectPlayError:"Direct play failed — falling back to transcode",
  VideoRangeNotSupported:"HDR/Dolby Vision range not supported — tone-mapping",
  BitrateLimitExceeded:"Bitrate limit exceeded for this stream",
};
function reasonPlain(code){return TRANSCODE_REASONS[code]||code;}

async function jellyfinPoll(){
  if(!S.jellyfin.url||!S.jellyfin.apiKey){S.jfStatus="idle";return;}
  if(S.jfStatus!=="online"){S.jfStatus="checking";if(S.view==="jellyfin")render();}
  try{
    // Server info (once per poll — cheap, confirms reachability + auth)
    if(!S.jfInfo){
      try{S.jfInfo=await jellyfinFetch("/System/Info");}catch(e){/* non-fatal */}
    }
    const sessions=await jellyfinFetch("/Sessions");
    // Only keep sessions that are actually playing something
    S.jfSessions=Array.isArray(sessions)?sessions.filter(s=>s.NowPlayingItem):[];
    S.jfStatus="online";S.jfError="";
  }catch(e){
    S.jfSessions=[];
    if(e.message==="no-config"){S.jfStatus="idle";}
    else if(e.name==="AbortError"){S.jfStatus="offline";S.jfError="Timed out — server unreachable at this address.";}
    else if(e.message&&e.message.startsWith("http-401")){S.jfStatus="offline";S.jfError="401 Unauthorized — check the API key.";}
    else if(e.message&&e.message.startsWith("http-")){S.jfStatus="offline";S.jfError="Server returned "+e.message.replace("http-","")+".";}
    else{
      // TypeError "Failed to fetch" is the classic mixed-content / CORS signature
      S.jfStatus="blocked";
      S.jfError=location.protocol==="https:"
        ?"Blocked — this page is HTTPS, so the browser refuses to talk to an http:// Jellyfin. The monitor needs an https:// Jellyfin address: on the NAS run  tailscale serve --bg --https=8097 8096  then enter https://<your-nas>.ts.net:8097 above. (Or open NAS Hub from your NAS's own http address instead of app.nashubapp.com.)"
        :"Couldn't reach Jellyfin. Check the URL, or CORS may be blocking the request.";
    }
  }
  if(S.view==="jellyfin")render();
}
function startJellyfinPoll(){
  stopJellyfinPoll();
  jellyfinPoll();
  S.jfPollTimer=setInterval(jellyfinPoll,4000); // ~4s live poll
}
function stopJellyfinPoll(){
  if(S.jfPollTimer){clearInterval(S.jfPollTimer);S.jfPollTimer=null;}
}
async function loadJellyfinLogs(){
  try{
    const logs=await jellyfinFetch("/System/Logs");
    S.jfLogs=Array.isArray(logs)?logs:[];
    render();
  }catch(e){toast("Couldn't load logs — "+(S.jfError||e.message),"#ff5050");}
}
async function openJellyfinLog(name){
  try{
    toast("Loading "+name+"…","#4b8fff");
    const txt=await jellyfinFetch("/System/Logs/Log?name="+encodeURIComponent(name),true);
    openLogView(name,txt);
  }catch(e){toast("Couldn't open log — "+(S.jfError||e.message),"#ff5050");}
}

// ── FULL-SCREEN LOG / ERROR VIEWER ────────────────────────────────────────────
// Lives directly on <body>, NOT inside #app: render() replaces #app wholesale, so
// an in-#app overlay would lose its scroll position every time a toast fired.
const LOG_VIEW_MAX=250000; // only the tail is painted; Copy still copies everything

function escHtml(s){return String(s==null?"":s).replace(/[&<>]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;"}[c]));}

function openLogView(title,text){
  removeLogViewDom();
  const full=String(text==null?"":text);
  S.logView={title:title||"Log",text:full,pushed:false};
  const truncated=full.length>LOG_VIEW_MAX;
  const shown=truncated?full.slice(-LOG_VIEW_MAX):full;
  const o=document.createElement("div");
  o.className="log-overlay";
  o.id="log-overlay";
  o.innerHTML=`<div class="log-hdr">
      <button class="log-btn" onclick="closeLogView()" aria-label="Back">←&nbsp;Back</button>
      <div class="log-title">${escHtml(S.logView.title)}</div>
      <button class="log-btn log-btn-alt" onclick="copyLogView()">Copy&nbsp;log</button>
    </div>
    <div class="log-body">
      ${truncated?`<div class="log-trunc">Showing the last ${Math.round(LOG_VIEW_MAX/1024)} KB of a ${Math.round(full.length/1024)} KB file — <strong>Copy log</strong> still copies the whole thing.</div>`:""}
      <pre class="log-pre">${escHtml(shown)}</pre>
    </div>`;
  document.body.appendChild(o);
  document.body.style.overflow="hidden";
  // Push a history entry so the iOS edge-swipe-back gesture closes the log
  // instead of leaving the app.
  try{history.pushState({nashubLog:1},"",location.href);S.logView.pushed=true;}catch(e){}
  const body=o.querySelector(".log-body");
  if(body)body.scrollTop=body.scrollHeight; // ffmpeg errors are at the end
}
function removeLogViewDom(){
  const el=document.getElementById("log-overlay");
  if(el)el.remove();
  document.body.style.overflow="";
}
// Back button / Escape: unwind the history entry we pushed and let popstate do
// the closing, so the two routes can never disagree about what is on screen.
function closeLogView(){
  if(!S.logView)return;
  if(S.logView.pushed){S.logView.pushed=false;history.back();return;}
  S.logView=null;removeLogViewDom();
}
function copyLogView(){
  if(!S.logView)return;
  copyText(S.logView.text,"Log");
}
window.addEventListener("popstate",()=>{

// ── STARTER TILE PACKS ───────────────────────────────────────────────────────
// The slowest part of setup is adding a dozen apps one at a time and getting each
// port right. A pack is just a curated list of catalog ids: pick one, type the NAS
// address once, and every tile lands configured. Ports come from CATALOG, so they
// stay correct without a second list to maintain. Apps already added are skipped
// rather than duplicated, so packs can be stacked safely.
const TILE_PACKS=[
  {id:"media",  name:"Media Server", emoji:"🎬", color:"#00A4DC",
   blurb:"Watch your own library anywhere — server plus the request page for the family.",
   apps:["jellyfin","jellyseerr"]},
  {id:"arr",    name:"The *arr Stack", emoji:"📡", color:"#35C5F4",
   blurb:"The automation chain: indexers, TV, film, subtitles and both download clients.",
   apps:["prowlarr","sonarr","radarr","bazarr","qbittorrent","sabnzbd"]},
  {id:"homeops",name:"Home Ops", emoji:"🛠️", color:"#4aff6a",
   blurb:"Run the box itself — containers, the NAS console, uptime and your reverse proxy.",
   apps:["truenas","portainer","uptime-kuma","nginxpm"]},
  {id:"photos", name:"Photos & Documents", emoji:"📷", color:"#FF6B35",
   blurb:"Leave Google Photos and Dropbox behind — photos, scans and files, all yours.",
   apps:["immich","paperless","nextcloud","filebrowser"]},
  {id:"privacy",name:"Privacy & Network", emoji:"🛡️", color:"#AB47BC",
   blurb:"Block ads for the whole house and keep passwords on your own hardware.",
   apps:["pihole","vaultwarden","adguard"]},

   blurb:"Automation and cameras, running locally instead of on somebody's cloud.",
   apps:["homeassistant","nodered","frigate"]},

function packItems(pack){
  // A custom pack carries its own app templates; a built-in names catalog ids.
  if(pack.custom)return pack.items||[];
  return pack.apps.map(id=>CATALOG.find(c=>c.id===id)).filter(Boolean);
}
// Keep the group's tier from each sync response (members never had it before 4.13.1).
function noteGroupTier(data){
  if(!S.syncGroup||!data||typeof data.tier!=="string")return;
  if(S.syncGroup.tier!==data.tier){S.syncGroup.tier=data.tier;saveSyncGroup();}
}
const PACKS_KEY="nashub-custom-packs-v1";
const PACK_PFX="nashub-pack://";
function saveCustomPacks(){localStorage.setItem(PACKS_KEY,JSON.stringify(S.customPacks||[]));}
// Turn the current catalog into a reusable pack.
// PRIVACY: a pack is a list of TEMPLATES, never a copy of your setup. Addresses,
// usernames, passwords, API keys, notes and Tailscale overrides are all dropped
// here — sharing a pack must never hand someone your NAS's IP or credentials.
function packTemplateFrom(app){
  return{id:app.id,name:app.name,emoji:app.emoji,color:app.color,port:app.port,cat:app.cat,desc:app.desc||""};
}
function startPackFromCurrent(){

function sharePack(id){
  const p=(S.customPacks||[]).find(x=>x.id===id);if(!p)return;

  let code;
  try{code=PACK_PFX+btoa(encodeURIComponent(JSON.stringify(payload)));}
  catch(e){toast("Couldn't build the share code","#ff5555");return;}

function importPackCode(raw){
  const s=String(raw||"").trim();
  if(!s){toast("Paste a pack code first","#FFC300");return;}
  if(!s.startsWith(PACK_PFX)){toast("That doesn't look like a pack code","#ff5555");return;}
  let data;
  try{
    const b=s.slice(PACK_PFX.length);
    let json;
    try{json=decodeURIComponent(atob(b));}catch(e){json=atob(b);}
    data=JSON.parse(json);
  }catch(e){toast("Couldn't read that pack code","#ff5555");return;}
  const items=(Array.isArray(data.items)?data.items:[]).map(cleanApp).filter(Boolean).map(packTemplateFrom);
  if(!items.length){toast("That pack has no apps in it","#ff5555");return;}
  const pack={id:"cp-"+Date.now(),name:String(data.name||"Shared pack").replace(/[<>]/g,"").slice(0,40),
    emoji:String(data.emoji||"📦").slice(0,4),blurb:String(data.blurb||"").replace(/[<>]/g,"").slice(0,140),
    items,custom:true,imported:true,created:new Date().toISOString()};

// Some defaults genuinely collide — qBittorrent and SABnzbd both ship on :8080, and
// they cannot both have it on one machine. Say so on the card instead of handing
// someone two tiles where one is quietly wrong.
function packPortClashes(pack){
  const seen={},clash=[];
  packItems(pack).forEach(c=>{
    if(seen[c.port])clash.push({port:c.port,names:[seen[c.port],c.name]});
    else seen[c.port]=c.name;
  });
  return clash;
}
// Built-ins and the user's own packs are looked up the same way everywhere.
function allPacks(){return[...TILE_PACKS,...(S.customPacks||[])];}
function findPack(id){return allPacks().find(p=>p.id===id);}
function packNewCount(pack){return packItems(pack).filter(c=>!S.apps.some(a=>a.id===c.id)).length;}

function openPack(id){
  const p=findPack(id);if(!p)return;

  S.pack={id,ip:S.homeIp||(common?common.host:"")};

}

// ── HOSTS: move everything at one address ────────────────────────────────────
// "My NAS moved" is the single most destructive thing to get wrong, so this is
// deliberately NOT a find-and-replace across every tile. Dave's constraint: not
// all tiles live on the NAS — Maintenance Vault and Ride Planner are public
// websites that happen to be tiles. So: group by host, show what is on each one,
// and change exactly one host at a time. Nothing moves unless that host is edited.

function hostKind(h){
  const v=String(h||"").trim().toLowerCase();
  if(!v)return"none";
  if(/^100\.(6[4-9]|[7-9]\d|1[01]\d|12[0-7])\./.test(v))return"tailscale";
  if(/^10\./.test(v))return"lan";
  if(/^192\.168\./.test(v))return"lan";
  if(/^172\.(1[6-9]|2\d|3[01])\./.test(v))return"lan";
  if(/^127\./.test(v)||v==="localhost")return"lan";
  if(/\.local$/.test(v))return"lan";
  if(/^\d{1,3}(\.\d{1,3}){3}$/.test(v))return"public";  // a real routable IP
  if(!v.includes("."))return"lan";                       // bare hostname → on your network
  return"public";                                        // a domain name → off the NAS
}
const HOST_KIND_META={
  lan:{label:"On your network",icon:"🏠",tone:"var(--ok)"},
  tailscale:{label:"Tailscale address",icon:"🔒",tone:"#2d6ef7"},
  public:{label:"Public website — not on your NAS",icon:"🌐",tone:"var(--warn)"},
  none:{label:"No address yet",icon:"—",tone:"var(--t3)"},
};

// Distinct hosts, each with the apps sitting on it. Apps whose address is a full
// URL keep that URL verbatim (buildUrl passes those straight through), so they are
// grouped but flagged — rewriting only the host of a full URL would be a guess.
function hostGroups(){
  const m=new Map();
  S.apps.forEach(a=>{
    const full=/^https?:\/\//i.test(asText(a.address).trim());
    const h=extractIp(a.address);
    if(!h)return;
    if(!m.has(h))m.set(h,{host:h,kind:hostKind(h),apps:[],hasFullUrl:false});
    const g=m.get(h);
    g.apps.push(a);
    if(full)g.hasFullUrl=true;
  });
  const order={lan:0,tailscale:1,public:2};
  return[...m.values()].sort((a,b)=>(order[a.kind]-order[b.kind])||b.apps.length-a.apps.length||a.host.localeCompare(b.host));
}

function startHostEdit(host){
  S.hostEdit={from:host,to:host};
  render();
  const el=document.getElementById("host-to");
  if(el){el.focus();el.select();}
}
function cancelHostEdit(){S.hostEdit=null;render();}
function applyHostEdit(){
  const e=S.hostEdit;if(!e)return;
  const to=String(e.to||"").trim().replace(/\/+$/,"");
  if(!to){toast("Enter the new address","#FFC300");return;}
  // The target is a host, full stop. Someone pasting a URL from a browser bar
  // ("http://192.168.1.50:8096/web") means the machine, not that exact page —
  // taking it literally used to rewrite every app on the old host to that one
  // URL and throw their ports away. normalizeHost keeps just the hostname/IP.
  const host=normalizeHost(to);
  if(!host){toast("Enter a hostname or IP, not a full address","#FFC300");return;}
  if(host===e.from){toast("That's the same address","#FFC300");cancelHostEdit();return;}
  invalidateChecks();
  let n=0;
  S.apps=S.apps.map(a=>{
    if(extractIp(a.address)!==e.from)return a;         // other hosts are never touched
    n++;
    const cur=asText(a.address).trim();
    // Preserve a full URL's scheme and path; swap only its host.
    if(/^https?:\/\//i.test(cur)){
      try{const u=new URL(cur);u.hostname=host;return{...a,address:u.toString().replace(/\/+$/,"")};}
      catch(err){return{...a,address:host};}
    }
    return{...a,address:host};   // protocol is the app's own; a bare host carries none
  });
  save();
  S.hostEdit=null;
  S.status={};S.times={};              // old results describe the old address
  render();
  toast(`Moved ${n} app${n===1?"":"s"} to ${host} ✓`);
  checkAll(true);
}

        oninput="S.hostEdit.to=this.value;const p=document.getElementById('host-prev-to');if(p)p.textContent=extractIp(this.value)||'…'" onkeydown="if(event.key==='Enter'){event.preventDefault();applyHostEdit();}if(event.key==='Escape'){event.preventDefault();cancelHostEdit();}">

// Type a few letters, Enter opens the app. Also reaches every screen by name, so
// the settings you can never remember the path to are two keystrokes away.
// Desktop: Cmd/Ctrl+K or "/". Touch: the 🔍 button in the header.

// Ranked match. Lower score wins. A miss returns -1. Beyond plain substring this
// accepts a subsequence ("jly" → Jellyfin) so half-remembered names still land.
function palScore(hay,q){
  if(!q)return 50;
  const h=String(hay||"").toLowerCase(),n=q.toLowerCase();
  if(!h)return -1;
  if(h===n)return 0;
  if(h.startsWith(n))return 1;
  const w=h.indexOf(" "+n);
  if(w>-1)return 2;                       // start of any later word
  const i=h.indexOf(n);
  if(i>-1)return 3+Math.min(i,20)/100;    // substring, earlier is better
  let qi=0;
  for(let hi=0;hi<h.length&&qi<n.length;hi++)if(h[hi]===n[qi])qi++;
  return qi===n.length?8:-1;              // scattered subsequence, ranked last
}

// One flat, ordered list — apps first, then commands. The index is what the
// arrow keys and Enter act on, so it is computed in exactly one place.
function palResults(){
  const q=(S.pal?.q||"").trim();
  const groupName=id=>(S.groups.find(g=>g.id===id)||{}).name||"";
  // A miss is Infinity, never -1: feeding -1 into Math.min makes the WORST field
  // win, which silently killed matching on address and category.
  const f=(hay,penalty)=>{const v=palScore(hay,q);return v<0?Infinity:v+penalty;};
  const apps=S.apps.map(a=>({
    s:Math.min(
      f(a.name,0),
      f(a.cat,4),
      f(a.address,4),
      f(groupName(a.groupId),4),
      f(a.notes,6)
    ),item:a
  })).filter(x=>isFinite(x.s))
    .sort((a,b)=>a.s-b.s||(b.item.favorite?1:0)-(a.item.favorite?1:0)||a.item.name.localeCompare(b.item.name))
    .slice(0,q?12:8)
    .map(x=>({kind:"app",app:x.item}));
  const cmds=palCommands().map(c=>({s:Math.min(f(c.name,0),f(c.sub,3)),c}))
    .filter(x=>isFinite(x.s))
    .sort((a,b)=>a.s-b.s)
    .slice(0,q?8:6)
    .map(x=>({kind:"cmd",cmd:x.c}));
  return[...apps,...cmds];
}

function palMove(d){

function palRun(i){
  const r=palResults()[i];
  if(!r)return;
  if(r.kind==="app"){

    if(!app.address){editApp(app.id);toast("Add an address for "+app.name,"#FFC300");return;}
    openApp(app.id);

  }

  if(r.cmd.run()!==true)closePalette();

  if((e.key==="k"||e.key==="K")&&(e.metaKey||e.ctrlKey)){e.preventDefault();S.pal?closePalette():openPalette();return;}
  if(e.key==="/"&&!typing&&!S.pal&&!S.qaApp&&!S.logView){e.preventDefault();openPalette();return;}

});

// ── AI DIAGNOSTICS ────────────────────────────────────────────────────────────
async function buildJfDiagnostics(){
  const lines=[];
  lines.push("# Jellyfin Diagnostics — "+new Date().toISOString());
  if(S.jfInfo)lines.push(`Server: ${S.jfInfo.ServerName||"?"} v${S.jfInfo.Version||"?"}`);
  lines.push("");
  const ss=S.jfSessions||[];
  lines.push(`## Active sessions (${ss.length})`);
  ss.forEach(s=>{
    const it=s.NowPlayingItem||{},ps=s.PlayState||{},ti=s.TranscodingInfo;
    lines.push(`- ${s.UserName||"?"} on ${s.DeviceName||"?"} (${s.Client||"?"} ${s.ApplicationVersion||""})`);
    lines.push(`  Playing: ${it.SeriesName?it.SeriesName+" — ":""}${it.Name||"?"} [${it.Container||"?"}]`);
    lines.push(`  Method: ${ps.PlayMethod||"?"}${ps.IsPaused?" (paused)":""}  Position: ${fmtTime(ticksToSec(ps.PositionTicks))}/${fmtTime(ticksToSec(it.RunTimeTicks))}`);
    if(ti){
      lines.push(`  TranscodeReasons: ${(ti.TranscodeReasons||[]).join(", ")||"none reported"}`);
      lines.push(`  Transcode: ${ti.VideoCodec||"?"}${ti.IsVideoDirect?"(direct)":""} / ${ti.AudioCodec||"?"}${ti.IsAudioDirect?"(direct)":""} → ${ti.Container||"?"} @ ${(ti.Bitrate/1000000).toFixed(1)}Mbps, ${Math.round(ti.CompletionPercentage||0)}% done`);
    }
  });
  if(!ss.length)lines.push("(nothing playing right now)");
  // newest ffmpeg/transcode log tail
  try{
    if(!S.jfLogs.length){const l=await jellyfinFetch("/System/Logs");S.jfLogs=Array.isArray(l)?l:[];}
    const ff=S.jfLogs.filter(l=>/ffmpeg|transcode/i.test(l.Name||"")).sort((a,b)=>new Date(b.DateModified||0)-new Date(a.DateModified||0))[0];
    if(ff){
      const txt=await jellyfinFetch("/System/Logs/Log?name="+encodeURIComponent(ff.Name),true);
      lines.push("");lines.push(`## Tail of ${ff.Name} (last 6KB)`);
      lines.push("```");lines.push(txt.slice(-6000));lines.push("```");
    }
  }catch(e){lines.push("");lines.push("(couldn't fetch ffmpeg log: "+e.message+")");}
  return lines.join("\n");
}

// Build the Jellyfin base URL with the same Tailscale-aware logic as buildUrl()
function jellyfinBase(){
  const raw=(S.jellyfin.url||"").trim().replace(/\/+$/,"");
  if(!raw)return null;
  // A full https:// URL is honoured exactly as typed (e.g. a Tailscale Serve
  // address). Only a plain http:// URL gets its host swapped for Tailscale.
  if(raw.startsWith("https://"))return raw;
  if(S.tsHost&&activeMode()==="away"&&raw.startsWith("http://")){
    try{
      const u=new URL(raw);
      return`${S.tsProto||"https"}://${normalizeHost(S.tsHost)}:${u.port||"8096"}`;
    }catch(e){/* fall through */}
  }
  if(raw.startsWith("http"))return raw;
  // Bare host[:port] entered
  if(S.tsHost&&activeMode()==="away"){
    const port=raw.split(":")[1]||"8096";
    return`${S.tsProto||"https"}://${S.tsHost}:${port}`;
  }
  return`http://${raw.includes(":")?raw:raw+":8096"}`;
}
// Authenticated JSON fetch — real CORS (not no-cors) so we can read the body.
// Mirrors checkAll's AbortController timeout pattern.
async function jellyfinFetch(path,asText){
  const base=jellyfinBase();
  if(!base)throw new Error("no-config");
  const key=S.jellyfin.apiKey||"";
  const ctrl=new AbortController();
  const t=setTimeout(()=>ctrl.abort(),8000);
  try{
    const sep=path.includes("?")?"&":"?";
    // X-Emby-Token header is primary; api_key query param is the fallback
    const r=await fetch(base+path+sep+"api_key="+encodeURIComponent(key),{
      method:"GET",
      headers:{"X-Emby-Token":key,"Accept":asText?"text/plain":"application/json"},
      mode:"cors",cache:"no-store",signal:ctrl.signal
    });
    clearTimeout(t);
    if(!r.ok)throw new Error("http-"+r.status);
    return asText?await r.text():await r.json();
  }catch(e){
    clearTimeout(t);
    throw e;
  }
}

// ── SYNC ACTIONS ──────────────────────────────────────────────────────────────
// ── SYNC HISTORY / ROLLBACK ──────────────────────────────────────────────────
// The worker snapshots the catalog on every publish and keeps the last 10.
// Viewing the list and restoring are both open to the group owner.
async function loadSyncHistory(){
  const sg=S.syncGroup;
  if(!sg?.adminToken)return;
  S.syncHist={...(S.syncHist||{}),loading:true,error:""};
  render();
  try{
    const h={"Authorization":`Bearer ${sg.adminToken}`};
    const r=await fetch(`${API_BASE}/sync/${sg.code}/history`,{headers:h});
    const d=await r.json();
    if(!r.ok)throw new Error(d.error||"Couldn't load history");
    S.syncHist={loading:false,error:"",...d};
  }catch(e){
    S.syncHist={loading:false,error:e.message||"Couldn't load history",versions:[]};
  }
  render();
}
async function restoreSyncVersion(v){
  const sg=S.syncGroup;
  if(!sg?.adminToken)return;
  const entry=(S.syncHist?.versions||[]).find(x=>x.version===v);
  if(!await askSheet(`Restore version ${v}${entry?` (${entry.appCount} app${entry.appCount===1?"":"s"})`:""}?\n\nEveryone in the group gets this catalog. Your current one is saved first, so this can be undone.`))return;
  toast("Restoring…","#a78bfa");
  try{
    const h={"Authorization":`Bearer ${sg.adminToken}`,"Content-Type":"application/json"};
    const r=await fetch(`${API_BASE}/sync/${sg.code}/restore`,{method:"POST",headers:h,body:JSON.stringify({version:v})});
    const d=await r.json();
    if(!r.ok)throw new Error(d.error||"Restore failed");
    S.syncGroup.version=d.version;saveSyncGroup();
    // Pull the restored catalog down to THIS device too. pollSync() deliberately
    // returns early for admins, so it never did this — the admin kept the OLD
    // catalog and the next auto-push republished it, silently undoing the restore
    // for everyone. (Found in review 2026-09-16.) Fetch and apply directly instead.
    await pullGroupNow();
    await loadSyncHistory();
    loadSyncMembers();
    toast(`Restored v${d.restoredFrom} → now v${d.version} ✓`);
  }catch(e){
    toast(e.message||"Restore failed","#ff5555");
  }
}
function buildSyncHistory(){
  const hist=S.syncHist;
  if(!hist)return`<button style="width:100%;padding:11px;background:transparent;border:1px solid var(--line);border-radius:13px;color:var(--t3);font-size:13px;cursor:pointer;font-family:inherit;margin-top:8px" onclick="loadSyncHistory()">🕘 Version history &amp; rollback</button>`;
  if(hist.loading)return`<div style="text-align:center;font-size:12px;color:var(--t3);padding:14px">Loading history…</div>`;
  if(hist.error)return`<div class="host-warn" style="margin-top:10px">${esc(hist.error)} <span role="button" tabindex="0" style="color:var(--accent-text);cursor:pointer;font-weight:700" onclick="loadSyncHistory()">Try again</span></div>`;
  const vs=hist.versions||[];
  return`<div style="margin-top:18px">
    <div style="display:flex;align-items:center;justify-content:space-between;margin-bottom:10px">
      <div style="font-size:11px;color:var(--t3);text-transform:uppercase;letter-spacing:1px;font-weight:700">Version history</div>
      <span role="button" tabindex="0" style="font-size:11px;color:var(--accent-text);cursor:pointer;font-weight:700" onclick="loadSyncHistory()">↻ Refresh</span>
    </div>
    ${vs.length?vs.map(v=>{
      const when=v.savedAt?new Date(v.savedAt):(v.updated?new Date(v.updated):null);
      const stamp=when?when.toLocaleString([],{month:"short",day:"numeric",hour:"2-digit",minute:"2-digit"}):"—";
      return`<div style="display:flex;align-items:center;gap:10px;padding:10px 0;border-bottom:1px solid var(--line)">
        <div style="width:40px;flex-shrink:0;text-align:center;font:700 13px 'IBM Plex Mono',ui-monospace,monospace;color:var(--ink)">v${v.version}</div>
        <div style="flex:1;min-width:0">
          <div style="font-size:13px;font-weight:700;color:var(--ink)">${v.appCount} app${v.appCount===1?"":"s"}</div>
          <div style="font-size:11px;color:var(--t3);margin-top:2px">${esc(stamp)}</div>
        </div>
        <button class="host-btn" onclick="restoreSyncVersion(${v.version})">Restore</button>
      </div>`;
    }).join(""):`<div style="font-size:12px;color:var(--t3);padding:12px 0;line-height:1.6">No earlier versions yet. The next time you push an update, the catalog it replaces is saved here — the last ${hist.keep||10} are kept.</div>`}
    ${hist.restoredFrom?`<div style="font-size:11px;color:var(--t3);margin-top:10px">Last restore came from v${hist.restoredFrom}.</div>`:""}
  </div>`;
}

// Promote a member to editor, or put them back to view-only. Both directions are free since 5.0.0.
async function setMemberRole(deviceId,role){
  const sg=S.syncGroup;
  if(!sg?.adminToken)return;
  const m=(S.syncMembers||[]).find(x=>x.deviceId===deviceId);
  const who=m?.deviceName||"this device";
  if(role==="editor"&&!await askSheet(`Let ${who} change the group's apps for everyone?\n\nThey'll be able to push updates to all members, the same as you.`))return;
  try{
    const h={"Authorization":`Bearer ${sg.adminToken}`,"Content-Type":"application/json"};
    const r=await fetch(`${API_BASE}/sync/${sg.code}/member-role`,{method:"POST",headers:h,body:JSON.stringify({deviceId,role})});
    const d=await r.json();
    if(!r.ok)throw new Error(d.error||"Couldn't change access");
    S.syncMembers=(S.syncMembers||[]).map(x=>x.deviceId===deviceId?{...x,role:d.role}:x);
    render();
    toast(d.role==="editor"?`${who} can now edit ✓`:`${who} is view-only ✓`);
  }catch(e){toast(e.message||"Couldn't change access","#ff5555");}
}
function saveSyncGroup(){localStorage.setItem(SYNC_KEY,JSON.stringify(S.syncGroup));}

// ── Recovering a group whose owner is gone ──────────────────────────────────
// Transfer needs a living owner. This is the other case: the device that created
// the group is gone and took the only admin token with it, so the group would sit
// frozen on its last publish forever — members unable even to promote each other,
// because promotion needs admin auth. Two proofs are accepted: the licence that
// created the group (instant), or membership after the owner has gone quiet.
async function recoverCheck(codeIn){
  const code=String(codeIn||"").trim().toUpperCase();
  if(!/^[A-Z0-9]{3}-[A-Z0-9]{3}$/.test(code)){toast("Enter the group code, like ABC-123","#FFC300");return;}
  try{
    const r=await fetch(`${API_BASE}/sync/${code}/recover`);
    if(!r.ok)throw new Error("No group with that code");
    S.recover={code,status:await r.json()};
    render();
  }catch(e){toast(e.message||"No group with that code","#ff5555");}
}
async function recoverClaim(useLicence){
  const rec=S.recover; if(!rec)return;
  const body={deviceName:getDeviceName()};
  {
    const mt=S.syncGroup?.code===rec.code?S.syncGroup.memberToken:null;
    if(!mt){toast("This device isn't a member of that group, so it can't claim it","#ff5555");return;}
    body.deviceId=getDeviceId(); body.memberToken=mt;
  }
  try{
    const r=await fetch(`${API_BASE}/sync/${rec.code}/recover`,{method:"POST",headers:{"Content-Type":"application/json"},body:JSON.stringify(body)});
    const d=await r.json().catch(()=>({}));
    if(!r.ok)throw new Error(d.error||"Couldn't recover that group");
    S.syncGroup={...(S.syncGroup||{}),code:rec.code,adminToken:d.adminToken,role:"admin",version:d.version,name:d.name};
    saveSyncGroup(); S.recover=null; S.syncView="home";
    toast(`You own ${d.name||rec.code} again ✓`,"#4aff6a");
    loadSyncMembers(); render();
  }catch(e){toast(e.message||"Couldn't recover that group","#ff5555");}
}

// ── Ownership transfer ──────────────────────────────────────────────────────
// Claiming ROTATES the admin token server-side, so the previous owner is locked
// out the instant the code is redeemed. That is deliberate: a "transfer" that
// left the old device still able to publish would be a second key, not a move.
async function startTransfer(){
  if(!S.syncGroup?.adminToken)return;
  try{
    const r=await fetch(`${API_BASE}/sync/${S.syncGroup.code}/transfer`,{
      method:"POST",headers:{Authorization:`Bearer ${S.syncGroup.adminToken}`}
    });
    if(!r.ok){const d=await r.json().catch(()=>({}));throw new Error(d.error||"Couldn't start the transfer");}
    const d=await r.json();
    S.xfer={code:d.claimCode};
    render();
  }catch(e){toast(e.message||"Couldn't start the transfer","#ff5555");}
}
async function cancelTransfer(){
  if(S.syncGroup?.adminToken){
    try{
      await fetch(`${API_BASE}/sync/${S.syncGroup.code}/transfer`,{
        method:"DELETE",headers:{Authorization:`Bearer ${S.syncGroup.adminToken}`}
      });
    }catch(e){}
  }
  S.xfer=null;toast("Transfer cancelled");render();
}
async function claimOwnership(codeIn){
  const claim=String(codeIn||"").trim().toUpperCase();
  if(!claim){toast("Enter the transfer code","#ff5555");return;}
  if(!S.syncGroup?.code){toast("Join the group first, then claim it","#ff5555");return;}
  try{
    const r=await fetch(`${API_BASE}/sync/${S.syncGroup.code}/transfer/claim`,{
      method:"POST",headers:{"Content-Type":"application/json"},
      body:JSON.stringify({claimCode:claim})
    });
    const d=await r.json().catch(()=>({}));
    if(!r.ok)throw new Error(d.error||"That code didn't work");
    S.syncGroup={...S.syncGroup,adminToken:d.adminToken,role:"admin",version:d.version??S.syncGroup.version};
    saveSyncGroup();
    S.xfer=null;
    toast("This device now owns the group ✓","#4aff6a");
    loadSyncMembers();
    render();
  }catch(e){toast(e.message||"That code didn't work","#ff5555");}
}

// The sync service keeps the apps list exactly as sent but drops any separate "settings" field
// (measured 2026-09-10). So groups, Tailscale host and home IP travel as one marked record inside
// the list, and members lift it out before treating the rest as apps. (BUG-NH-024)
const SYNC_SETTINGS_ID="__nashub_settings__";
function packSync(apps){return[...apps,{id:SYNC_SETTINGS_ID,name:"NAS Hub settings",address:"",settings:syncSettings()}];}
function unpackSync(data){
  const list=Array.isArray(data&&data.apps)?data.apps:[];
  const rec=list.find(a=>a&&a.id===SYNC_SETTINGS_ID);
  return{apps:list.filter(a=>!(a&&a.id===SYNC_SETTINGS_ID)),settings:(data&&data.settings)||(rec&&rec.settings)||null};
}
function applySyncSettings(s){
  if(!s||typeof s!=="object")return;
  if("tsHost" in s){S.tsHost=(s.tsHost||"").trim();S.tsProto=s.tsProto||S.tsProto||"https";
    if(S.tsHost)localStorage.setItem(TS_HOST_KEY,S.tsHost);else localStorage.removeItem(TS_HOST_KEY);
    localStorage.setItem(TS_PROTO_KEY,S.tsProto);}
  if("homeIp" in s){S.homeIp=(s.homeIp||"").trim();
    if(S.homeIp)localStorage.setItem(HOME_IP_KEY,S.homeIp);else localStorage.removeItem(HOME_IP_KEY);}
  if(s.jellyfinUrl&&s.jellyfinUrl!==S.jellyfin.url){S.jellyfin.url=s.jellyfinUrl;saveJellyfin();}
  if(Array.isArray(s.groups)){
    s.groups.map(cleanGroup).filter(Boolean).forEach(g=>{if(!S.groups.find(x=>x.id===g.id))S.groups.push(g);});
    save();
  }
}
